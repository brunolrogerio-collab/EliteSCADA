services:
  iec104-lib60870:
    build:
      context: ./iec104-lib60870
      dockerfile: Dockerfile
    container_name: elitescada-lab-iec104-lib60870
    ports:
      - "2404:2404"
    healthcheck:
      test:
        - CMD-SHELL
        - "nc -z 127.0.0.1 2404"
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
