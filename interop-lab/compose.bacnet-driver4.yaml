services:
  bacnet-bacpypes-driver4:
    build:
      context: ./bacnet/driver4-bacpypes
      dockerfile: Dockerfile
    container_name: elitescada-lab-bacnet-driver4
    network_mode: host
    environment:
      BACNET_ADDRESS: 127.0.0.1/8:47808
      BACNET_DEVICE_INSTANCE: "599001"
      BACNET_HEALTH_PORT: "18080"
      BACNET_ENABLE_RPM: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=2).read()"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s

  bacnet-bacpypes-rp-driver4:
    build:
      context: ./bacnet/driver4-bacpypes
      dockerfile: Dockerfile
    container_name: elitescada-lab-bacnet-rp-driver4
    network_mode: host
    environment:
      BACNET_ADDRESS: 127.0.0.1/8:47811
      BACNET_DEVICE_INSTANCE: "599002"
      BACNET_HEALTH_PORT: "18081"
      BACNET_ENABLE_RPM: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/health', timeout=2).read()"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
