<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="100%" height="100%"><defs><!-- Gradiente metálico vertical para os painéis da máquina --><linearGradient id="metal-v" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#b8b8b8" /><stop offset="25%" stop-color="#ffffff" /><stop offset="75%" stop-color="#e0e0e0" /><stop offset="100%" stop-color="#8a8a8a" /></linearGradient><!-- Gradiente para o cano cilíndrico esquerdo --><linearGradient id="pipe-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#555" /><stop offset="50%" stop-color="#ccc" /><stop offset="100%" stop-color="#333" /></linearGradient></defs><!-- Estilos gerais para bordas e cores recorrentes --><!-- ==================== CAMADA TRASEIRA (POLÍGONO CINZA CLARO CORRIGIDO) ==================== --><polygon points="6,12 280,12 280,262 106,262 106,116 6,116" fill="#e1e1e1" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" /><!-- ==================== ESTRUTURA MAQUINÁRIO CENTRAL ==================== --><!-- Painel Traseiro Superior Metálico --><rect x="212" y="262" width="654" height="114" fill="url(#metal-v)" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Pés Inferiores de Apoio --><!-- Esquerdo --><polygon points="218,566 218,598 258,598 280,566" fill="url(#metal-v)" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Direito --><polygon points="848,566 826,598 866,598 866,566" fill="url(#metal-v)" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Base Inferior Principal Metálica --><rect x="212" y="438" width="654" height="128" fill="url(#metal-v)" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Viga Horizontal Central (Sobreposta) --><rect x="158" y="376" width="742" height="62" fill="url(#metal-v)" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- ==================== ENTRADA LATERAL (CANO E SETA) ==================== --><!-- Cano cilíndrico à esquerda --><rect x="84" y="354" width="134" height="18" fill="url(#pipe-grad)" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Seta Branca Indicativa interna ao cano --><path d="M 104,363 L 150,363 M 142,359 L 150,363 L 142,367" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" /><!-- ==================== PAINEL DE CONTROLE AMARELO CLARO ==================== --><rect x="186" y="142" width="194" height="208" fill="#fef9e7" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Componentes internos do painel: Botão quadrado preto superior esquerdo --><rect x="202" y="162" width="28" height="24" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Fileira Superior de botões circulares --><circle cx="266" cy="172" r="10" fill="none" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="288" cy="172" r="10" fill="#facc15" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Matriz de botões - Linha 1 (Pretos e Amarelo na extrema direita) --><circle cx="224" cy="198" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="246" cy="198" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="288" cy="198" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="310" cy="198" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="332" cy="198" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Matriz de botões - Linha 2 (Verde, Vermelho, Amarelo - Repetidos) --><circle cx="212" cy="222" r="10" fill="#4ade80" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="238" cy="222" r="10" fill="#ef4444" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="264" cy="222" r="10" fill="#facc15" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="304" cy="222" r="10" fill="#4ade80" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="330" cy="222" r="10" fill="#ef4444" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="356" cy="222" r="10" fill="#facc15" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Matriz de botões - Linha 3 (Abaixo do bloco colorido) --><circle cx="224" cy="246" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="246" cy="246" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="316" cy="246" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="338" cy="246" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Matriz de botões - Linha 4 --><circle cx="212" cy="270" r="10" fill="#4ade80" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="238" cy="270" r="10" fill="#ef4444" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="264" cy="270" r="10" fill="#facc15" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Matriz de botões - Linha 5 (Dois últimos pretos desalinhados no centro-baixo) --><circle cx="224" cy="294" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="278" cy="286" r="10" fill="#000000" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><!-- Botão de Emergência Grande (Inferior Direito do painel) --><circle cx="280" cy="322" r="16" fill="#facc15" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /><circle cx="280" cy="322" r="10" fill="#ef4444" stroke-linejoin="round" stroke-width="1.5" stroke="#000000" /></svg>
