name: Preview Licensing CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'src/Scada.Api/Licensing/**'
      - 'src/Scada.Api/Persistence/EngineeringPersistenceApi.cs'
      - 'src/Scada.Core/Product/**'
      - 'src/Scada.Core/Tags/InMemoryTagRegistry.cs'
      - 'src/Scada.Engineering/ImportExport/Handlers/TagEngineeringHandler.cs'
      - 'src/Scada.LicenseGenerator/**'
      - 'tests/Scada.Core.Tests/Product/**'
      - 'tests/Scada.Core.Tests/PreviewProductCapacityTests.cs'
      - 'tests/Scada.Drivers.Tests/ProductLicensedRuntimeCoordinatorTests.cs'
      - 'docs/licensing/**'
      - 'docs/LICENSING-PRIORITY-GATE.md'
      - 'docs/PREVIEW-LICENSING-IMPLEMENTATION-PLAN.md'
      - 'docs/README-LICENSING-WORKSTREAM.md'
      - '.github/workflows/preview-licensing-ci.yml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'src/Scada.Api/Licensing/**'
      - 'src/Scada.Api/Persistence/EngineeringPersistenceApi.cs'
      - 'src/Scada.Core/Product/**'
      - 'src/Scada.Core/Tags/InMemoryTagRegistry.cs'
      - 'src/Scada.Engineering/ImportExport/Handlers/TagEngineeringHandler.cs'
      - 'src/Scada.LicenseGenerator/**'
      - 'tests/Scada.Core.Tests/Product/**'
      - 'tests/Scada.Core.Tests/PreviewProductCapacityTests.cs'
      - 'tests/Scada.Drivers.Tests/ProductLicensedRuntimeCoordinatorTests.cs'
      - 'docs/licensing/**'
      - 'docs/LICENSING-PRIORITY-GATE.md'
      - 'docs/PREVIEW-LICENSING-IMPLEMENTATION-PLAN.md'
      - 'docs/README-LICENSING-WORKSTREAM.md'
      - '.github/workflows/preview-licensing-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Restore
        run: dotnet restore ScadaPlatform.sln
      - name: Build product solution
        run: dotnet build ScadaPlatform.sln -c Release --no-restore
      - name: Build License Generator
        run: dotnet build src/Scada.LicenseGenerator/Scada.LicenseGenerator.csproj -c Release
      - name: Licensing and capacity Core tests
        run: >-
          dotnet test tests/Scada.Core.Tests/Scada.Core.Tests.csproj
          -c Release
          --no-restore
          --filter "FullyQualifiedName~Scada.Core.Tests.Product.Licensing|FullyQualifiedName~Scada.Core.Tests.PreviewProductCapacityTests"
          --logger "console;verbosity=normal"
      - name: Runtime licensing tests
        run: >-
          dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj
          -c Release
          --no-restore
          --filter "FullyQualifiedName~Scada.Drivers.Tests.ProductLicensedRuntimeCoordinatorTests"
          --logger "console;verbosity=normal"
      - name: Host licensing composition smoke
        shell: bash
        run: |
          set -uo pipefail
          export ASPNETCORE_URLS=http://127.0.0.1:5091
          dotnet run --project src/Scada.Api/Scada.Api.csproj --no-build --configuration Release --no-launch-profile > /tmp/scada-licensing-api.log 2>&1 &
          API_PID=$!

          fail() {
            echo "=== EliteSCADA licensing host log ==="
            cat /tmp/scada-licensing-api.log || true
            kill "$API_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
            exit 1
          }

          ready=false
          for _ in $(seq 1 30); do
            http_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:5091/health || true)
            if [ "$http_code" = "200" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = "true" ] || fail

          curl -fsS http://127.0.0.1:5091/api/licensing/status > /tmp/licensing-status.json || fail
          curl -fsS http://127.0.0.1:5091/api/licensing/request > /tmp/licensing-request.json || fail

          if ! python3 - <<'PY'
          import json
          with open('/tmp/licensing-status.json') as f:
              status = json.load(f)
          with open('/tmp/licensing-request.json') as f:
              request = json.load(f)
          assert status['license']['state'] == 'Demo', status
          assert status['license']['maximumTags'] == 200, status
          assert status['runtime']['state'] == 'Idle', status
          assert request['requestCode'].startswith('ESREQ1.'), request
          PY
          then
            fail
          fi

          kill "$API_PID" 2>/dev/null || true
          wait "$API_PID" 2>/dev/null || true

          if grep -q "ObjectDisposedException" /tmp/scada-licensing-api.log; then
            echo "Host shutdown emitted ObjectDisposedException."
            cat /tmp/scada-licensing-api.log
            exit 1
          fi
      - name: Dump licensing host log on failure
        if: failure()
        run: cat /tmp/scada-licensing-api.log || true
  publish-license-generator:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Publish Windows x64 graphical License Generator
        shell: pwsh
        run: >-
          dotnet publish src/Scada.LicenseGenerator/Scada.LicenseGenerator.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/license-generator/win-x64
      - name: Smoke-test Windows executable startup path
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath ./artifacts/license-generator/win-x64/EliteSCADA.LicenseGenerator.exe `
            -ArgumentList '--smoke-test' `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) { throw "License Generator smoke test failed with exit code $($process.ExitCode)." }
      - name: Upload Windows x64 License Generator
        uses: actions/upload-artifact@v4
        with:
          name: EliteSCADA-LicenseGenerator-win-x64
          path: artifacts/license-generator/win-x64/**
          if-no-files-found: error
          retention-days: 30
