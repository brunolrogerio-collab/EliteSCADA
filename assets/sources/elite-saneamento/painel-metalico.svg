<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%"><defs><!-- Gradiente metálico (Cinza escuro -> Prata brilhante -> Cinza escuro) --><linearGradient id="metal-gradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#555555" /><stop offset="25%" stop-color="#999999" /><stop offset="50%" stop-color="#FFFFFF" /><stop offset="75%" stop-color="#A6A6A6" /><stop offset="100%" stop-color="#444444" /></linearGradient></defs><!-- Grupo estrutural com contorno preto fino externo --><g stroke="#000000" stroke-width="2" stroke-linejoin="round"><!-- Moldura Externa Principal com o Gradiente Metálico --><rect x="10" y="10" width="480" height="200" fill="url(#metal-gradient)" /><!-- Borda Interna Branca (Sem contorno preto interno) --><rect x="40" y="40" width="420" height="140" fill="#FFFFFF" stroke="none" /><!-- Tela/Painel Central Preto --><rect x="45" y="45" width="410" height="130" fill="#000000" /></g></svg>
