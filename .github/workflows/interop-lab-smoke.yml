name: Interop Lab Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "interop-lab/**"
      - ".github/workflows/interop-lab-smoke.yml"

permissions:
  contents: read

jobs:
  base-lab-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate scenario catalog JSON
        run: python -m json.tool interop-lab/scenarios/catalog.json >/dev/null

      - name: Validate Node-RED flow JSON
        run: python -m json.tool interop-lab/node-red/flows.json >/dev/null

      - name: Validate base Compose model
        working-directory: interop-lab
        run: docker compose -f compose.yaml config >/dev/null

      - name: Validate CIP overlay Compose model
        working-directory: interop-lab
        run: docker compose -f compose.yaml -f compose.cip.yaml config >/dev/null

      - name: Build and start base lab
        working-directory: interop-lab
        run: docker compose -f compose.yaml up -d --build

      - name: MQTT control-plane round-trip smoke
        working-directory: interop-lab
        run: bash scripts/lab.sh smoke

      - name: Restore MQTT Driver integration tests
        run: dotnet restore tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj

      - name: EliteSCADA MQTT transport against live Mosquitto
        env:
          ELITESCADA_MQTT_INTEGRATION_HOST: 127.0.0.1
          ELITESCADA_MQTT_INTEGRATION_PORT: '1883'
          ELITESCADA_MQTT_INTEGRATION_TLS: 'false'
          ELITESCADA_MQTT_INTEGRATION_PROTOCOLS: mqtt5,mqtt311
        run: >-
          dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj
          --no-restore
          --configuration Release
          --filter Category=BrokerIntegration
          --logger "console;verbosity=normal"

      - name: Show lab status
        if: always()
        working-directory: interop-lab
        run: docker compose -f compose.yaml ps

      - name: Dump logs on failure
        if: failure()
        working-directory: interop-lab
        run: docker compose -f compose.yaml logs --no-color

      - name: Stop lab
        if: always()
        working-directory: interop-lab
        run: docker compose -f compose.yaml down -v --remove-orphans
