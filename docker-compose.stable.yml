name: elitescada-stable

services:
  database:
    image: timescale/timescaledb:2.29.2-pg18
    environment:
      POSTGRES_DB: elitescada
      POSTGRES_USER: elitescada
      POSTGRES_PASSWORD: ${ELITESCADA_DB_PASSWORD:?Set ELITESCADA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ELITESCADA_DB_PORT:-15432}:5432"
    volumes:
      - elitescada_stable_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/stable/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5080"
      ConnectionStrings__EliteScada: "Host=database;Port=5432;Database=elitescada;Username=elitescada;Password=${ELITESCADA_DB_PASSWORD};Pooling=true"
      ConnectionStrings__Historian: "Host=database;Port=5432;Database=elitescada;Username=elitescada;Password=${ELITESCADA_DB_PASSWORD};Pooling=true"
      Authentication__Enabled: "true"
      Authentication__Local__Enabled: "true"
      Authentication__Local__SecureCookie: "false"
      Authentication__Jwt__Issuer: ${ELITESCADA_JWT_ISSUER:-elitescada-local}
      Authentication__Jwt__Audience: ${ELITESCADA_JWT_AUDIENCE:-elitescada-local-browser}
      Authentication__Jwt__SigningKey: ${ELITESCADA_JWT_SIGNING_KEY:?Set ELITESCADA_JWT_SIGNING_KEY in .env}
      ELITESCADA_MACHINE_ID: ${ELITESCADA_MACHINE_ID:?Set ELITESCADA_MACHINE_ID in .env}
      Historian__Provider: timescaledb
      HistoricalQuery__Enabled: "true"
      HistoricalQuery__CursorKeyBase64: ${ELITESCADA_HISTORICAL_CURSOR_KEY_BASE64:?Set ELITESCADA_HISTORICAL_CURSOR_KEY_BASE64 in .env}
      ProtectedMaterial__Store__Path: /app/data/protected-material
      ProtectedMaterial__Store__ProtectionKeyFile: /app/host-keys/protected.key
      MediaSources__AllowPrivateNetwork: "true"
      MediaSources__GatewayControlUrl: http://media-gateway:9997
      MediaSources__GatewayPlaybackUrl: http://media-gateway:8888
    networks: [default, media_relay]
    volumes:
      - elitescada_stable_protected_material:/app/data/protected-material
      - elitescada_stable_host_keys:/app/host-keys
    ports:
      - "127.0.0.1:${ELITESCADA_API_PORT:-15080}:5080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  media-gateway:
    image: bluenviron/mediamtx:1.21.1@sha256:dc22a8b09668e7f5b493cfa848c395349ad16fd47fef1cc7b7eb5b87a1186232
    volumes:
      - ./docker/stable/mediamtx.yml:/mediamtx.yml:ro
    networks: [media_relay]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

  web:
    build:
      context: .
      dockerfile: docker/stable/Dockerfile.web
    ports:
      - "127.0.0.1:${ELITESCADA_WEB_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  media_relay:

volumes:
  elitescada_stable_database:
    name: elitescada-stable-database
  elitescada_stable_protected_material:
    name: elitescada-stable-protected-material
  elitescada_stable_host_keys:
    name: elitescada-stable-host-keys
