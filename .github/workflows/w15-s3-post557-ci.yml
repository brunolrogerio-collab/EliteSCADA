name: W15 S3 post-557 focused CI

on:
  push:
    branches:
      - work/driver-interaction-s3-engineering-persistence
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'ScadaPlatform.sln'
      - 'global.json'
      - '.github/workflows/w15-s3-post557-ci.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: w15-s3-post557-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        id: restore
        continue-on-error: true
        run: dotnet restore ScadaPlatform.sln

      - name: Build owning test projects
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet build tests/Scada.Core.Tests/Scada.Core.Tests.csproj --no-restore --configuration Release
          dotnet build tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj --no-restore --configuration Release

      - name: Core C1 C2 focused tests
        id: core
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p TestResults
          dotnet test tests/Scada.Core.Tests/Scada.Core.Tests.csproj             --no-build --configuration Release             --filter "FullyQualifiedName~DriverInteractionEngineeringFoundationTests|FullyQualifiedName~DriverInteractionEngineeringExchangeTests"             --logger "trx;LogFileName=s3-core.trx"             --results-directory TestResults             --verbosity normal

      - name: Driver C3 and recovery focused tests
        id: drivers
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p TestResults
          dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj             --no-build --configuration Release             --filter "FullyQualifiedName~DriverInteractionActiveRuntimeCatalogTests|FullyQualifiedName~PublishedRuntimeActivationServiceTests|FullyQualifiedName~PersistedRuntimeRecoveryServiceTests"             --logger "trx;LogFileName=s3-drivers.trx"             --results-directory TestResults             --verbosity normal

      - name: Publish evidence to issue 559
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          DRIVERS_OUTCOME: ${{ steps.drivers.outcome }}
        run: |
          python3 - <<'PY' > /tmp/s3-ci-comment.md
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def counts(path):
              p = Path(path)
              if not p.exists():
                  return {"total":"0","passed":"0","failed":"0","skipped":"0"}
              root = ET.parse(p).getroot()
              counters = root.find(".//{*}Counters")
              if counters is None:
                  return {"total":"0","passed":"0","failed":"0","skipped":"0"}
              a = counters.attrib
              return {
                  "total": a.get("total", "0"),
                  "passed": a.get("passed", "0"),
                  "failed": a.get("failed", "0"),
                  "skipped": a.get("notExecuted", a.get("skipped", "0")),
              }

          core = counts("TestResults/s3-core.trx")
          drivers = counts("TestResults/s3-drivers.trx")
          print("## DEV DRIVER-INTERACTION-S3 — POST-557 FOCUSED CI")
          print()
          print(f"- run: `{os.environ['GITHUB_RUN_ID']}` / attempt `{os.environ['GITHUB_RUN_ATTEMPT']}`")
          print(f"- commit: `{os.environ['GITHUB_SHA']}`")
          print(f"- restore: `{os.environ.get('RESTORE_OUTCOME','unknown')}`")
          print(f"- build: `{os.environ.get('BUILD_OUTCOME','unknown')}`")
          print(f"- Core C1/C2: `{os.environ.get('CORE_OUTCOME','unknown')}` — total {core['total']} / passed {core['passed']} / failed {core['failed']} / skipped {core['skipped']}")
          print(f"- Drivers C3/recovery: `{os.environ.get('DRIVERS_OUTCOME','unknown')}` — total {drivers['total']} / passed {drivers['passed']} / failed {drivers['failed']} / skipped {drivers['skipped']}")
          print()
          print("Filters:")
          print("- `DriverInteractionEngineeringFoundationTests`")
          print("- `DriverInteractionEngineeringExchangeTests`")
          print("- `DriverInteractionActiveRuntimeCatalogTests`")
          print("- `PublishedRuntimeActivationServiceTests`")
          print("- `PersistedRuntimeRecoveryServiceTests`")
          PY

          gh api repos/${GITHUB_REPOSITORY}/issues/559/comments             --method POST             -f body="$(cat /tmp/s3-ci-comment.md)"

      - name: Enforce focused CI result
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          DRIVERS_OUTCOME: ${{ steps.drivers.outcome }}
        run: |
          test "$RESTORE_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
          test "$CORE_OUTCOME" = "success"
          test "$DRIVERS_OUTCOME" = "success"
