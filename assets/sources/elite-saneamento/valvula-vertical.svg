<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente metálico para a seção oval e cilíndrica -->
    <linearGradient id="metal-grey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#444444" />
      <stop offset="35%" stop-color="#AAAAAA" />
      <stop offset="55%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#777777" />
      <stop offset="100%" stop-color="#333333" />
    </linearGradient>
  </defs>
  <!-- Grupo geral com contornos pretos padronizados e fundo transparente -->
  <g stroke="#000000" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Haste/Eixo de acoplamento central (Une os dois blocos) -->
    <rect x="125" y="93" width="45" height="14" fill="#666666" />
    <!-- Estrutura da direita: Cilindro com Flanges -->
    <rect x="165" y="65" width="65" height="70" fill="url(#metal-grey)" />
    <rect x="155" y="50" width="85" height="15" fill="#333333" />
    <rect x="155" y="135" width="85" height="15" fill="#333333" />
    <rect x="187" y="75" width="22" height="50" fill="#15B800" />
    <!-- Estrutura da esquerda: Oval e painel verde sobreposto -->
    <ellipse cx="95" cy="100" rx="35" ry="50" fill="url(#metal-grey)" />
    <rect x="73" y="70" width="44" height="60" fill="#15B800" />
  </g>
</svg>
