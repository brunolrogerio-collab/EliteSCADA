<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="100%" height="100%">
  <defs>
    <!-- Padrão de Hachura Listrada para a base cinza -->
    <pattern id="tank-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#000000" stroke-width="2" />
    </pattern>
    <!-- Gradiente para o fluido/material interno -->
    <linearGradient id="fluid-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A07855" />
      <stop offset="60%" stop-color="#8B633E" />
      <stop offset="100%" stop-color="#5C3A1A" />
    </linearGradient>
  </defs>
  <!-- Grupo geral com contornos pretos padronizados e fundo transparente -->
  <g stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Conteúdo Interno Marrom -->
    <rect x="43" y="60" width="214" height="190" fill="url(#fluid-gradient)" stroke="none" />
    <!-- Estrutura Externa do Tanque -->
    <rect x="35" y="250" width="230" height="20" fill="url(#tank-hatch)" />
    <path d="M 38 35 L 38 250 L 262 250 L 262 35" stroke-width="3" />
    <line x1="43" y1="35" x2="43" y2="250" stroke-width="1.5" />
    <line x1="257" y1="35" x2="257" y2="250" stroke-width="1.5" />
    <!-- Marcadores em V na parte inferior -->
    <g stroke="#000000" stroke-width="2.5">
      <path d="M 50 230 L 55 240 L 60 230" />
      <path d="M 72 230 L 77 240 L 82 230" />
      <path d="M 94 230 L 99 240 L 104 230" />
      <path d="M 116 230 L 121 240 L 126 230" />
      <path d="M 138 230 L 143 240 L 148 230" />
      <path d="M 160 230 L 165 240 L 170 230" />
      <path d="M 182 230 L 187 240 L 192 230" />
      <path d="M 204 230 L 209 240 L 214 230" />
      <path d="M 226 230 L 231 240 L 236 230" />
      <path d="M 248 230 L 253 240 L 258 230" />
    </g>
    <!-- Linha horizontal preta logo abaixo dos V -->
    <line x1="48" y1="245" x2="252" y2="245" stroke-width="2" />
    <!-- Partículas/Bolhas Ovais Douradas -->
    <g fill="#CDA066" stroke="#000000" stroke-width="1.5">
      <ellipse cx="58" cy="160" rx="4" ry="7" />
      <ellipse cx="62" cy="195" rx="5" ry="8" />
      <ellipse cx="78" cy="142" rx="5" ry="8" />
      <ellipse cx="88" cy="202" rx="4" ry="6" />
      <ellipse cx="108" cy="180" rx="4" ry="6" />
      <ellipse cx="112" cy="155" rx="4" ry="7" />
      <ellipse cx="128" cy="208" rx="4" ry="6" />
      <ellipse cx="145" cy="175" rx="5" ry="9" />
      <ellipse cx="148" cy="210" rx="4" ry="6" />
      <ellipse cx="180" cy="162" rx="4" ry="7" />
      <ellipse cx="205" cy="212" rx="5" ry="7" />
      <ellipse cx="212" cy="170" rx="4" ry="7" />
      <ellipse cx="240" cy="148" rx="5" ry="9" />
      <ellipse cx="242" cy="198" rx="4" ry="7" />
    </g>
  </g>
</svg>
