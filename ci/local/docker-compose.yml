services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${ELITESCADA_CI_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/10-ci-databases.sql:ro
