services:
  dnp3-dnp3py:
    build:
      context: ..
      dockerfile: interop-lab/dnp3-dnp3py/Dockerfile
    container_name: elitescada-lab-dnp3-dnp3py
    ports:
      - "20000:20000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',20000),2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
