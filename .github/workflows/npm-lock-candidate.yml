name: EliteSCADA npm lock candidate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  lockfile:
    name: Generate npm lock candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Generate lockfile
        working-directory: web/scada-web
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/scada-web/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "Commit reproducible npm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
