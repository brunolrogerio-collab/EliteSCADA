name: MQTT Secure Interop Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "interop-lab/mqtt/mosquitto-secure.conf"
      - "interop-lab/compose.mqtt-secure.yaml"
      - ".github/workflows/interop-mqtt-secure-smoke.yml"
      - "src/Scada.Drivers/Mqtt/**"
      - "tests/Scada.Drivers.Tests/Mqtt*"

permissions:
  contents: read

jobs:
  mqtt-secure-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_PROXY: mqtt-secure.local,mqtt-crl.local,127.0.0.1,localhost
      no_proxy: mqtt-secure.local,mqtt-crl.local,127.0.0.1,localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate ephemeral CA, issued server certificate, CRL and password file
        shell: bash
        run: |
          set -euo pipefail
          TLS_DIR="$PWD/interop-lab/mqtt/tls"
          mkdir -p "$TLS_DIR/newcerts"
          touch "$TLS_DIR/index.txt"
          printf '1000\n' > "$TLS_DIR/serial"
          printf '1000\n' > "$TLS_DIR/crlnumber"

          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$TLS_DIR/ca.key" \
            -out "$TLS_DIR/ca.crt" \
            -subj '/CN=EliteSCADA MQTT Lab CA' \
            -addext 'basicConstraints=critical,CA:TRUE,pathlen:0' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -addext 'subjectKeyIdentifier=hash'

          cat > "$TLS_DIR/openssl.cnf" <<EOF
          [ ca ]
          default_ca = CA_default

          [ CA_default ]
          dir = $TLS_DIR
          database = \$dir/index.txt
          new_certs_dir = \$dir/newcerts
          certificate = \$dir/ca.crt
          private_key = \$dir/ca.key
          serial = \$dir/serial
          crlnumber = \$dir/crlnumber
          default_md = sha256
          default_days = 1
          default_crl_days = 1
          policy = policy_any
          unique_subject = no
          copy_extensions = none
          x509_extensions = server_cert
          crl_extensions = crl_ext

          [ policy_any ]
          commonName = supplied

          [ server_cert ]
          basicConstraints = critical,CA:FALSE
          subjectAltName = @server_alt_names
          extendedKeyUsage = serverAuth
          keyUsage = critical,digitalSignature,keyEncipherment
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid,issuer
          crlDistributionPoints = URI:http://mqtt-crl.local:18080/ca.crl

          [ server_alt_names ]
          IP.1 = 127.0.0.1
          DNS.1 = localhost
          DNS.2 = mqtt-secure.local

          [ crl_ext ]
          authorityKeyIdentifier = keyid:always
          EOF

          openssl req -newkey rsa:2048 -nodes \
            -keyout "$TLS_DIR/server.key" \
            -out "$TLS_DIR/server.csr" \
            -subj '/CN=mqtt-secure.local'

          openssl ca -batch \
            -config "$TLS_DIR/openssl.cnf" \
            -extensions server_cert \
            -in "$TLS_DIR/server.csr" \
            -out "$TLS_DIR/server.crt"

          openssl ca \
            -config "$TLS_DIR/openssl.cnf" \
            -gencrl \
            -out "$TLS_DIR/ca.crl.pem"
          openssl crl \
            -in "$TLS_DIR/ca.crl.pem" \
            -outform DER \
            -out "$TLS_DIR/ca.crl"

          openssl verify \
            -CAfile "$TLS_DIR/ca.crt" \
            -purpose sslserver \
            -verify_hostname mqtt-secure.local \
            "$TLS_DIR/server.crt"
          openssl crl -inform DER -in "$TLS_DIR/ca.crl" -noout -issuer -lastupdate -nextupdate

          docker run --rm \
            -v "$TLS_DIR:/work" \
            eclipse-mosquitto:2.1.2-alpine \
            sh -c "mosquitto_passwd -b -c /work/passwords elitescada lab-secret && chown mosquitto:mosquitto /work/passwords && chmod 0700 /work/passwords"

          chmod 0644 \
            "$TLS_DIR/ca.crt" \
            "$TLS_DIR/server.crt" \
            "$TLS_DIR/server.key" \
            "$TLS_DIR/ca.crl"

      - name: Trust ephemeral lab CA and bind lab identities
        shell: bash
        run: |
          sudo cp interop-lab/mqtt/tls/ca.crt /usr/local/share/ca-certificates/elitescada-mqtt-lab-ca.crt
          sudo update-ca-certificates
          printf '127.0.0.1 mqtt-secure.local mqtt-crl.local\n' | sudo tee -a /etc/hosts >/dev/null
          openssl verify \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            -purpose sslserver \
            -verify_hostname mqtt-secure.local \
            interop-lab/mqtt/tls/server.crt

      - name: Start CRL distribution endpoint
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 18080 \
            --bind 127.0.0.1 \
            --directory interop-lab/mqtt/tls \
            >/tmp/elitescada-mqtt-crl-http.log 2>&1 &
          echo $! >/tmp/elitescada-mqtt-crl-http.pid
          for attempt in {1..20}; do
            if curl --noproxy '*' -fsS http://mqtt-crl.local:18080/ca.crl -o /tmp/elitescada-ca.crl; then
              cmp /tmp/elitescada-ca.crl interop-lab/mqtt/tls/ca.crl
              exit 0
            fi
            sleep 1
          done
          cat /tmp/elitescada-mqtt-crl-http.log || true
          exit 1

      - name: Validate secure Compose model
        working-directory: interop-lab
        run: docker compose -f compose.mqtt-secure.yaml config >/dev/null

      - name: Start secure Mosquitto and wait healthy
        working-directory: interop-lab
        run: docker compose -f compose.mqtt-secure.yaml up -d --wait --wait-timeout 60

      - name: Diagnose platform TLS chain policy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/elitescada-tls-probe
          dotnet new console \
            --name EliteScadaTlsProbe \
            --output /tmp/elitescada-tls-probe \
            --framework net10.0 \
            --no-restore >/dev/null
          cat > /tmp/elitescada-tls-probe/Program.cs <<'EOF'
          using System.Net.Security;
          using System.Net.Sockets;
          using System.Security.Authentication;
          using System.Security.Cryptography.X509Certificates;

          const string host = "mqtt-secure.local";
          const int port = 8883;

          using var tcp = new TcpClient();
          await tcp.ConnectAsync(host, port);

          using var tls = new SslStream(
              tcp.GetStream(),
              leaveInnerStreamOpen: false,
              userCertificateValidationCallback: (_, certificate, chain, errors) =>
              {
                  Console.WriteLine($"TLS_DIAGNOSTIC_POLICY_ERRORS={errors}");
                  Console.WriteLine($"TLS_DIAGNOSTIC_CERT_SUBJECT={certificate?.Subject ?? "<null>"}");

                  if (chain is null)
                  {
                      Console.WriteLine("TLS_DIAGNOSTIC_CHAIN=<null>");
                  }
                  else
                  {
                      Console.WriteLine($"TLS_DIAGNOSTIC_CHAIN_REVOCATION_MODE={chain.ChainPolicy.RevocationMode}");
                      Console.WriteLine($"TLS_DIAGNOSTIC_CHAIN_REVOCATION_FLAG={chain.ChainPolicy.RevocationFlag}");
                      Console.WriteLine($"TLS_DIAGNOSTIC_CHAIN_ELEMENTS={chain.ChainElements.Count}");

                      for (var index = 0; index < chain.ChainElements.Count; index++)
                      {
                          var element = chain.ChainElements[index];
                          Console.WriteLine($"TLS_DIAGNOSTIC_ELEMENT_{index}_SUBJECT={element.Certificate.Subject}");
                          foreach (var status in element.ChainElementStatus)
                          {
                              Console.WriteLine(
                                  $"TLS_DIAGNOSTIC_ELEMENT_{index}_STATUS={status.Status}:{status.StatusInformation.Trim()}");
                          }
                      }

                      foreach (var status in chain.ChainStatus)
                      {
                          Console.WriteLine(
                              $"TLS_DIAGNOSTIC_CHAIN_STATUS={status.Status}:{status.StatusInformation.Trim()}");
                      }
                  }

                  return errors == SslPolicyErrors.None;
              });

          try
          {
              await tls.AuthenticateAsClientAsync(new SslClientAuthenticationOptions
              {
                  TargetHost = host,
                  EnabledSslProtocols = SslProtocols.Tls12 | SslProtocols.Tls13,
                  CertificateRevocationCheckMode = X509RevocationMode.Online
              });
              Console.WriteLine("TLS_DIAGNOSTIC_HANDSHAKE=SUCCESS");
          }
          catch (AuthenticationException exception)
          {
              Console.WriteLine($"TLS_DIAGNOSTIC_HANDSHAKE=FAIL:{exception.GetType().Name}:{exception.Message}");
          }

          return 0;
          EOF
          dotnet run --project /tmp/elitescada-tls-probe/EliteScadaTlsProbe.csproj --framework net10.0

      - name: Restore MQTT Driver integration tests
        run: dotnet restore tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj

      - name: EliteSCADA MQTT transport over trusted TLS and authentication
        env:
          ELITESCADA_MQTT_INTEGRATION_HOST: mqtt-secure.local
          ELITESCADA_MQTT_INTEGRATION_PORT: '8883'
          ELITESCADA_MQTT_INTEGRATION_TLS: 'true'
          ELITESCADA_MQTT_INTEGRATION_PROTOCOLS: mqtt5,mqtt311
          ELITESCADA_MQTT_INTEGRATION_USERNAME: elitescada
          ELITESCADA_MQTT_INTEGRATION_PASSWORD: lab-secret
        run: >-
          dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj
          --no-restore
          --configuration Release
          --filter Category=BrokerIntegration
          --logger "console;verbosity=normal"

      - name: Show secure broker status
        if: always()
        working-directory: interop-lab
        run: docker compose -f compose.mqtt-secure.yaml ps

      - name: Dump secure broker logs on failure
        if: failure()
        working-directory: interop-lab
        run: docker compose -f compose.mqtt-secure.yaml logs --no-color

      - name: Stop secure broker
        if: always()
        working-directory: interop-lab
        run: docker compose -f compose.mqtt-secure.yaml down -v --remove-orphans

      - name: Stop CRL distribution endpoint
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/elitescada-mqtt-crl-http.pid ]]; then
            sudo kill "$(cat /tmp/elitescada-mqtt-crl-http.pid)" 2>/dev/null || true
          fi

      - name: Remove ephemeral trust anchor and PKI material
        if: always()
        shell: bash
        run: |
          sudo rm -f /usr/local/share/ca-certificates/elitescada-mqtt-lab-ca.crt
          sudo update-ca-certificates >/dev/null
          sudo rm -rf interop-lab/mqtt/tls
