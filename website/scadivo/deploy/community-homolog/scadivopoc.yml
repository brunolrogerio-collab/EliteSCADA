# Local-only Discourse container definition for the community SSO proof of concept.
# Copy to containers/scadivopoc.yml in the temporary discourse_docker checkout.
templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"

expose:
  - "127.0.0.1:18085:80"

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  DISCOURSE_HOSTNAME: localhost
  DISCOURSE_DEFAULT_LOCALE: pt_BR
  DISCOURSE_DEVELOPER_EMAILS: community-admin@scadivo.local
  DISCOURSE_SKIP_EMAIL_SETUP: "1"
  UNICORN_WORKERS: 1

volumes:
  - volume:
      host: scadivo_community_homolog_data
      guest: /shared
  - volume:
      host: scadivo_community_homolog_logs
      guest: /var/log

# Apply persistent Discourse site settings through its supported Rails interface.
run:
  - exec: >-
      rails r 'SiteSetting.title = %q{SCADIVO}; SiteSetting.global_notice = %q{A comunidade SCADIVO está concluindo a configuração inicial.}; SiteSetting.min_admin_password_length = 8; SiteSetting.min_password_length = 8; SiteSetting.port = 18085; SiteSetting.force_https = false; SiteSetting.allow_user_locale = true; SiteSetting.set_locale_from_accept_language_header = true; SiteSetting.set_locale_from_cookie = true; SiteSetting.set_locale_from_param = true; welcome = Topic.find_by(slug: %q{boas-vindas-ao-discourse}) || Topic.find_by(slug: %q{boas-vindas-a-comunidade-scadivo}); welcome.update!(title: %q{Boas-vindas à comunidade SCADIVO}, slug: %q{boas-vindas-a-comunidade-scadivo}) if welcome; guide = Topic.find_by(slug: %q{guia-de-administracao-primeiros-passos}) || Topic.find_by(slug: %q{primeiros-passos-comunidade-scadivo}); guide.update!(title: %q{Primeiros passos na comunidade SCADIVO}, slug: %q{primeiros-passos-comunidade-scadivo}) if guide; guide.first_post.revise(guide.user, {raw: %Q{Bem-vindo à comunidade SCADIVO!\n\nEste espaço conecta pessoas que estudam, integram e operam sistemas de automação e supervisão.\n\n**Para começar**\n\n- Apresente-se e conte um pouco sobre sua área.\n- Compartilhe perguntas, experiências e ideias.\n- Consulte as [Diretrizes da comunidade](/faq).\n- Escolha a categoria mais próxima do assunto.\n\n**Cuide da segurança**\n\nNão publique senhas, chaves, endereços privados ou dados de instalações reais. Use exemplos anonimizados.}}, validate_post: false) if guide'
  - exec: >-
      rails r 'TranslationOverride.upsert!(%q{pt_BR}, %q{wizard.title}, %q{Configuração inicial do SCADIVO}); TranslationOverride.upsert!(%q{pt_BR}, %q{finish_installation.congratulations}, %q{Configuração do SCADIVO concluída!}); TranslationOverride.reload_all_overrides!'
