name: EliteSCADA CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.sln'
      - '**/*.csproj'
      - '**/*.cs'
      - '**/*.json'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'web/scada-web/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, test and smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.29.2-pg18
        env:
          POSTGRES_DB: elitescada_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elitescada_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELITESCADA_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Database=elitescada_test;Username=postgres;Password=postgres;Pooling=false'
      ConnectionStrings__EliteScada: 'Host=127.0.0.1;Port=5432;Database=elitescada_test;Username=postgres;Password=postgres;Pooling=false'
      Historian__Provider: 'timescaledb'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        run: dotnet restore ScadaPlatform.sln

      - name: Build
        run: dotnet build ScadaPlatform.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ScadaPlatform.sln --no-build --configuration Release --verbosity normal

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          export ASPNETCORE_URLS=http://127.0.0.1:5080
          dotnet run --project src/Scada.Api/Scada.Api.csproj --no-build --configuration Release --no-launch-profile > /tmp/scada-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/health > /tmp/health.json; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/scada-api.log
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open('/tmp/health.json') as f:
              health = json.load(f)
          assert health == {'status': 'ok', 'service': 'scada-api'}
          PY

          historian_ready=false
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5080/api/diagnostics/runtime > /tmp/runtime-diagnostics.json
            if python3 - <<'PY'
          import json, sys
          with open('/tmp/runtime-diagnostics.json') as f:
              diagnostics = json.load(f)
          ok = diagnostics['historian']['provider'] == 'timescaledb' and diagnostics['historian']['writtenSamples'] >= 1
          sys.exit(0 if ok else 1)
          PY
            then
              historian_ready=true
              break
            fi
            sleep 1
          done

          if [ "$historian_ready" != "true" ]; then
            cat /tmp/runtime-diagnostics.json
            cat /tmp/scada-api.log
            exit 1
          fi

          cat /tmp/health.json
          cat /tmp/runtime-diagnostics.json
          curl -fsS http://127.0.0.1:5080/api/tags > /tmp/tags.json
          TAG_COUNT=$(python3 -c 'import json; print(len(json.load(open("/tmp/tags.json"))))')
          echo "Runtime exposed ${TAG_COUNT} TAGs"
          test "$TAG_COUNT" -ge 7

          TANK_ID=$(python3 - <<'PY'
          import json
          with open('/tmp/tags.json') as f:
              tags = json.load(f)
          print(next(tag['id'] for tag in tags if tag['path'] == 'Demo.Tank01.Level'))
          PY
          )
          curl -fsS "http://127.0.0.1:5080/api/history/${TANK_ID}?limit=100" > /tmp/history.json
          python3 - <<'PY'
          import json
          with open('/tmp/history.json') as f:
              history = json.load(f)
          assert len(history) >= 1
          assert all(sample['quality'] == 0 for sample in history)
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/security-roles > /tmp/security-roles.json
          python3 - <<'PY'
          import json
          with open('/tmp/security-roles.json') as f:
              roles = json.load(f)
          assert {role['key'] for role in roles} == {'operator', 'developer'}
          operator = next(role for role in roles if role['key'] == 'operator')
          capabilities = {grant['capability'] for grant in operator['grants']}
          # ASP.NET serializes enum values numerically on this direct DTO endpoint.
          assert 2 in capabilities  # CommandExecute
          assert 3 not in capabilities  # ProcessValueWrite
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/commands > /tmp/commands.json
          python3 - <<'PY'
          import json
          with open('/tmp/commands.json') as f:
              commands = json.load(f)
          assert {command['key'] for command in commands} == {'demo.p01.start', 'demo.p01.stop'}
          assert all(command['targetTagPath'] == 'Demo.P01.Running' for command in commands)
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/persistence/status > /tmp/persistence-status.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-status.json') as f:
              status = json.load(f)
          assert status['enabled'] is True
          assert status['provider'] == 'postgresql'
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/export/json > /tmp/current-engineering.json

          curl -fsS -X POST http://127.0.0.1:5080/api/engineering/persistence/ci-demo/save \
            -H 'content-type: application/json' \
            -d '{"projectName":"CI Demo","savedBy":"github-actions"}' > /tmp/persistence-save.json
          REVISION=$(python3 -c 'import json; print(json.load(open("/tmp/persistence-save.json"))["revision"])')
          echo "Saved engineering revision ${REVISION}"
          test "$REVISION" -ge 1
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-save.json') as f:
              saved = json.load(f)
          assert saved['basedOnRevision'] is None
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/workspace > /tmp/workspace-after-save.json
          python3 - <<'PY'
          import json
          with open('/tmp/workspace-after-save.json') as f:
              workspace = json.load(f)
          with open('/tmp/persistence-save.json') as f:
              saved = json.load(f)
          assert workspace['projectKey'] == 'ci-demo'
          assert workspace['baseRevision'] == saved['revision']
          assert workspace['isDirty'] is False
          assert workspace['lastSavedAtUtc'] is not None
          assert workspace['securityRoleCount'] == 2
          assert workspace['commandCount'] == 2
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/persistence/ci-demo/lifecycle > /tmp/lifecycle-draft.json
          python3 - <<'PY'
          import json
          with open('/tmp/lifecycle-draft.json') as f:
              lifecycle = json.load(f)
          assert lifecycle['status'] == 1
          assert lifecycle['workingRevision'] is not None
          assert lifecycle['publishedRevision'] is None
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/persistence/ci-demo/revisions > /tmp/persistence-revisions.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-revisions.json') as f:
              revisions = json.load(f)
          with open('/tmp/current-engineering.json') as f:
              engineering = json.load(f)
          assert len(revisions) >= 1
          assert revisions[0]['projectKey'] == 'ci-demo'
          assert revisions[0]['engineeringSchemaVersion'] == engineering['schemaVersion']
          assert revisions[0]['basedOnRevision'] is None
          PY

          curl -fsS -X POST http://127.0.0.1:5080/api/engineering/persistence/ci-demo/latest/preview > /tmp/persistence-preview.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-preview.json') as f:
              result = json.load(f)
          assert result['preview']['canApply'] is True
          assert result['revision']['projectKey'] == 'ci-demo'
          PY

          curl -fsS -X POST "http://127.0.0.1:5080/api/engineering/persistence/ci-demo/revisions/${REVISION}/publish" \
            -H 'content-type: application/json' \
            -d '{"publishedBy":"github-actions"}' > /tmp/persistence-publish.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-publish.json') as f:
              result = json.load(f)
          assert result['publication']['publishedRevision'] == result['revision']['revision']
          assert result['lifecycle']['status'] == 2
          PY

          curl -fsS -X POST http://127.0.0.1:5080/api/engineering/persistence/ci-demo/save \
            -H 'content-type: application/json' \
            -d '{"projectName":"CI Demo","savedBy":"github-actions-after-publish"}' > /tmp/persistence-save-2.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-save.json') as f:
              first = json.load(f)
          with open('/tmp/persistence-save-2.json') as f:
              second = json.load(f)
          assert second['revision'] > first['revision']
          assert second['basedOnRevision'] == first['revision']
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/workspace > /tmp/workspace-after-save-2.json
          python3 - <<'PY'
          import json
          with open('/tmp/workspace-after-save-2.json') as f:
              workspace = json.load(f)
          with open('/tmp/persistence-save-2.json') as f:
              saved = json.load(f)
          assert workspace['baseRevision'] == saved['revision']
          assert workspace['isDirty'] is False
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/persistence/ci-demo/lifecycle > /tmp/lifecycle-pending.json
          python3 - <<'PY'
          import json
          with open('/tmp/lifecycle-pending.json') as f:
              lifecycle = json.load(f)
          assert lifecycle['status'] == 3
          assert lifecycle['workingRevision'] > lifecycle['publishedRevision']
          PY

  frontend:
    name: Web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install dependencies
        working-directory: web/scada-web
        run: npm ci --no-audit --no-fund

      - name: Build React/Vite
        working-directory: web/scada-web
        run: npm run build

  e2e:
    name: Chromium end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.29.2-pg18
        env:
          POSTGRES_DB: elitescada_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elitescada_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__EliteScada: 'Host=127.0.0.1;Port=5432;Database=elitescada_e2e;Username=postgres;Password=postgres;Pooling=false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Restore backend
        run: dotnet restore ScadaPlatform.sln

      - name: Install frontend dependencies
        working-directory: web/scada-web
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: web/scada-web
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: web/scada-web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/scada-web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
