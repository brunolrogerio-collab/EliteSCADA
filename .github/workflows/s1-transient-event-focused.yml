name: S1 transient-event focused checkpoint

on:
  push:
    branches:
      - work/driver-interaction-s1-transient-runtime
    paths:
      - 'src/Scada.DriverHost/Runtime/TransientEventRuntimeDispatcher.cs'
      - 'tests/Scada.Drivers.Tests/TransientEventRuntimeDispatcherTests.cs'
      - '.github/workflows/s1-transient-event-focused.yml'

permissions:
  contents: read

jobs:
  focused:
    name: Focused transient-event dispatcher tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore focused test project
        run: dotnet restore tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj

      - name: Run Checkpoint 1 focused tests
        run: dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj --no-restore --configuration Release --filter FullyQualifiedName~TransientEventRuntimeDispatcherTests --verbosity normal
