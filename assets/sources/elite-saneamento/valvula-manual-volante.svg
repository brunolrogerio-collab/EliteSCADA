<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="100%" height="100%">
  <defs>
    <!-- Gradiente para o Volante Superior (Elipse) -->
    <linearGradient id="wheel-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#A6A6A6" />
      <stop offset="100%" stop-color="#555555" />
    </linearGradient>
    <!-- Gradiente Cilíndrico para o Corpo Central -->
    <linearGradient id="body-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555555" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#A6A6A6" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
  </defs>
  <!-- Grupo com contornos pretos padronizados -->
  <g stroke="#000000" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Haste Central do Volante -->
    <rect x="138" y="55" width="24" height="45" fill="#777777" />
    <!-- Volante Superior (Elipse com gradiente) -->
    <ellipse cx="150" cy="45" rx="90" ry="15" fill="url(#wheel-gradient)" />
    <!-- Corpo Cilíndrico Central -->
    <rect x="65" y="100" width="170" height="95" fill="url(#body-gradient)" />
    <!-- Flange Lateral Esquerda (Cinza Escuro) -->
    <rect x="35" y="80" width="30" height="135" fill="#3A3A3A" />
    <!-- Flange Lateral Direita (Cinza Escuro) -->
    <rect x="235" y="80" width="30" height="135" fill="#3A3A3A" />
  </g>
</svg>
