<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="100%" height="100%"><defs><!-- Padrão de Hachura Listrada para a base cinza --><pattern id="clean-tank-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="10" stroke="#000000" stroke-width="2" /></pattern><!-- Gradiente para o fluido/material interno --><linearGradient id="clean-fluid-gradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#A07855" /><stop offset="60%" stop-color="#8B633E" /><stop offset="100%" stop-color="#5C3A1A" /></linearGradient></defs><!-- Grupo geral com contornos pretos padronizados e fundo transparente --><g stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none"><!-- Fluido/Conteúdo Interno Marrom Liso --><rect x="43" y="60" width="214" height="190" fill="url(#clean-fluid-gradient)" stroke="none" /><!-- Estrutura Externa do Tanque (Paredes laterais e fundo cinza hachurado) --><!-- Base hachurada inferior --><rect x="35" y="250" width="230" height="20" fill="url(#clean-tank-hatch)" /><!-- Linha de contorno externa do tanque --><path d="M 38 35 L 38 250 L 262 250 L 262 35" stroke-width="3" /><!-- Linhas internas das paredes duvans laterais --><line x1="43" y1="35" x2="43" y2="250" stroke-width="1.5" /><line x1="257" y1="35" x2="257" y2="250" stroke-width="1.5" /></g></svg>
