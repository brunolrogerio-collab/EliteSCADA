<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 240" width="100%" height="100%">
  <defs>
    <!-- Gradiente vermelho/coral para o efeito cilíndrico do corpo -->
    <linearGradient id="red-motor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="45%" stop-color="#FF6B5B" />
      <stop offset="75%" stop-color="#E0241B" />
      <stop offset="100%" stop-color="#99140E" />
    </linearGradient>
    <!-- Gradiente para a caixa de ligação frontal -->
    <linearGradient id="red-box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D3D" />
      <stop offset="100%" stop-color="#B31912" />
    </linearGradient>
  </defs>
  <!-- Grupo Geral com fundo transparente e contornos pretos padronizados -->
  <g stroke="#000000" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Eixo Metálico -->
    <rect x="290" y="113" width="30" height="12" fill="#A9A9A9" />
    <ellipse cx="290" cy="119" rx="2" ry="6" fill="#7F7F7F" />
    <!-- Corpo Principal do Motor Vermelho -->
    <path d="M 40 40
             L 240 40
             A 60 78 0 0 1 290 119
             A 60 78 0 0 1 240 198
             L 40 198
             A 20 20 0 0 1 20 178
             L 20 60
             A 20 20 0 0 1 40 40 Z" fill="url(#red-motor-grad)" />
    <!-- Ranhuras/Aletas de Refrigeração Horizontais -->
    <g fill="#B31912" stroke="#000000" stroke-width="1.5">
      <rect x="40" y="58" width="220" height="10" rx="4" />
      <rect x="40" y="83" width="220" height="10" rx="4" />
      <rect x="40" y="108" width="220" height="10" rx="4" />
      <rect x="40" y="133" width="220" height="10" rx="4" />
      <rect x="40" y="158" width="220" height="10" rx="4" />
    </g>
    <!-- Caixa de Ligação Elétrica Vermelha -->
    <rect x="85" y="100" width="130" height="88" fill="url(#red-box-grad)" />
  </g>
</svg>
