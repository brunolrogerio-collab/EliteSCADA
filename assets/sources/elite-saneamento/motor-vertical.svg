<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 400" width="100%" height="100%">
  <!-- Grupo do Motor com contornos pretos padronizados -->
  <g stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Eixo Metálico (Base Inferior) -->
    <rect x="119" y="345" width="12" height="35" fill="#A9A9A9" />
    <ellipse cx="125" cy="345" rx="6" ry="2" fill="#7F7F7F" />
    <!-- Corpo Principal do Motor (Amarelo Arredondado) -->
    <rect x="35" y="30" width="180" height="315" rx="35" fill="#E6D319" />
    <!-- Ranhuras/Aletas de Refrigeração (Tubos Verticais), da esquerda para a direita -->
    <rect x="55" y="55" width="12" height="265" rx="6" fill="#D4C214" />
    <rect x="85" y="55" width="12" height="265" rx="6" fill="#D4C214" />
    <rect x="115" y="55" width="12" height="265" rx="6" fill="#D4C214" />
    <rect x="145" y="55" width="12" height="265" rx="6" fill="#D4C214" />
    <rect x="175" y="55" width="12" height="265" rx="6" fill="#D4C214" />
    <!-- Caixa de Ligação Elétrica (Retângulo Esquerdo) -->
    <rect x="38" y="110" width="105" height="150" fill="#EBF01D" />
  </g>
</svg>
