name: EliteSCADA CI

on:
  workflow_dispatch:
  push:
    branches: [ main, wave15/corrections-integration ]
    paths:
      - '**/*.sln'
      - '**/*.csproj'
      - '**/*.cs'
      - '**/*.json'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'web/scada-web/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, test and smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.29.2-pg18
        env:
          POSTGRES_DB: elitescada_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elitescada_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELITESCADA_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Database=elitescada_test;Username=postgres;Password=postgres;Pooling=false'
      ConnectionStrings__EliteScada: 'Host=127.0.0.1;Port=5432;Database=elitescada_test;Username=postgres;Password=postgres;Pooling=false'
      Historian__Provider: 'timescaledb'
      HistoricalQuery__Enabled: 'true'
      HistoricalQuery__CursorKeyBase64: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        run: dotnet restore ScadaPlatform.sln

      - name: Build
        run: dotnet build ScadaPlatform.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ScadaPlatform.sln --no-build --configuration Release --verbosity normal -m:1

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "RUNTIME_SMOKE_FAILURE line=${LINENO} command=${BASH_COMMAND} status=${status}"; cat /tmp/scada-api.log || true; exit "${status}"' ERR
          export ASPNETCORE_URLS=http://127.0.0.1:5080
          # Keep the runtime boot deterministic: integration tests create
          # disposable persisted projects in elitescada_test, while this
          # smoke test validates a fresh PostgreSQL-backed application.
          export ConnectionStrings__EliteScada='Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false'
          dotnet run --project src/Scada.Api/Scada.Api.csproj --no-build --configuration Release --no-launch-profile > /tmp/scada-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          ready=false
          # Cold CI startup currently crosses 30s after the full test suite on pg/Timescale runners.
          # Keep this bounded but allow enough startup grace before judging the Runtime unhealthy.
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5080/health > /tmp/health.json; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/scada-api.log
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open('/tmp/health.json') as f:
              health = json.load(f)
          assert health == {'status': 'ok', 'service': 'scada-api'}
          PY

          curl -fsS http://127.0.0.1:5080/api/diagnostics/runtime > /tmp/runtime-diagnostics-neutral.json
          cat /tmp/health.json
          cat /tmp/runtime-diagnostics-neutral.json
          python3 - <<'PY'
          import json
          with open('/tmp/runtime-diagnostics-neutral.json') as f:
              diagnostics = json.load(f)
          runtime = diagnostics['runtime']
          historian = diagnostics['historian']
          assert runtime['mode'] == 'neutral'
          assert runtime['projectKey'] is None
          assert runtime['tagCount'] == 0
          assert historian['provider'] == 'timescaledb'
          assert historian['writtenSamples'] == 0
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/security-roles > /tmp/security-roles.json
          python3 - <<'PY'
          import json
          with open('/tmp/security-roles.json') as f:
              roles = json.load(f)
          assert {role['key'] for role in roles} == {'developer'}, roles
          developer = next(role for role in roles if role['key'] == 'developer')
          capabilities = {grant['capability'] for grant in developer['grants']}
          assert capabilities == {
              'view', 'tagRead', 'commandExecute', 'processValueWrite',
              'alarmAcknowledge', 'alarmShelve', 'trendUse', 'trendSave',
              'engineeringView', 'engineeringModify', 'userRoleAdmin', 'systemAdmin',
              'highAvailabilityObserve', 'highAvailabilityTransfer'
          }, developer
          assert 'highAvailabilityAdmin' not in capabilities, developer
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/commands > /tmp/commands.json
          python3 - <<'PY'
          import json
          with open('/tmp/commands.json') as f:
              commands = json.load(f)
          assert commands == [], commands
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/persistence/status > /tmp/persistence-status.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-status.json') as f:
              status = json.load(f)
          assert status['enabled'] is True
          assert status['provider'] == 'postgresql'
          PY

          curl -fsS http://127.0.0.1:5080/api/engineering/export/json > /tmp/current-engineering.json

          # First-project creation is an authority-owned operation. Switch from
          # the anonymous Runtime fixture to a fresh secure-installation session.
          kill "$API_PID"
          wait "$API_PID" 2>/dev/null || true
          export Authentication__Enabled=true
          export Authentication__Local__Enabled=true
          export Authentication__Local__SecureCookie=false
          export Authentication__Jwt__Issuer=elitescada-ci
          export Authentication__Jwt__Audience=elitescada-ci
          export Authentication__Jwt__SigningKey=elitescada-ci-signing-key-at-least-32-bytes
          export EngineeringRuntime__ProjectKey=ci-demo
          dotnet run --project src/Scada.Api/Scada.Api.csproj --no-build --configuration Release --no-launch-profile > /tmp/scada-api.log 2>&1 &
          API_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/health > /tmp/secure-health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5080/api/auth/config > /tmp/auth-config.json
          python3 - <<'PY'
          import json
          with open('/tmp/auth-config.json') as f:
              config = json.load(f)
          assert config['authenticationEnabled'] is True
          assert config['localLoginEnabled'] is True
          assert config['initialAdministratorRequired'] is True
          PY
          curl -fsS -c /tmp/scada-auth.cookie -X POST http://127.0.0.1:5080/api/auth/bootstrap \
            -H 'content-type: application/json' \
            -d '{"username":"ci-admin","displayName":"CI Administrator","password":"ci-admin-password"}' > /tmp/auth-bootstrap.json
          python3 - <<'PY'
          import json
          with open('/tmp/auth-bootstrap.json') as f:
              profile = json.load(f)
          assert profile['username'] == 'ci-admin'
          assert profile['identityProvider'] == 'local'
          PY

          curl -fsS -b /tmp/scada-auth.cookie -X POST http://127.0.0.1:5080/api/engineering/persistence/projects/first \
            -H 'content-type: application/json' \
            -d '{"projectKey":"ci-demo","projectName":"CI Demo"}' > /tmp/persistence-save.json
          FIRST_REVISION=$(python3 -c 'import json; print(json.load(open("/tmp/persistence-save.json"))["revision"]["revision"])')
          echo "Created first engineering revision ${FIRST_REVISION}"
          test "$FIRST_REVISION" -ge 1
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-save.json') as f:
              saved = json.load(f)
          assert saved['revision']['basedOnRevision'] is None
          PY

          curl -fsS -b /tmp/scada-auth.cookie http://127.0.0.1:5080/api/engineering/workspace > /tmp/workspace-after-save.json
          python3 - <<'PY'
          import json
          with open('/tmp/workspace-after-save.json') as f:
              workspace = json.load(f)
          with open('/tmp/persistence-save.json') as f:
              saved = json.load(f)
          assert workspace['projectKey'] == 'ci-demo'
          assert workspace['baseRevision'] == saved['revision']['revision']
          assert workspace['isDirty'] is False
          assert workspace['lastSavedAtUtc'] is not None
          assert workspace['securityRoleCount'] == 1
          # The retired legacy 72-dynamo set is gone; first-project setup seeds
          # the current 23-item catalog. Static SVG assets remain separate.
          assert workspace['dynamoCount'] == 23
          assert workspace['commandCount'] == 0
          PY

          curl -fsS -b /tmp/scada-auth.cookie http://127.0.0.1:5080/api/engineering/persistence/ci-demo/lifecycle > /tmp/lifecycle-draft.json
          python3 - <<'PY'
          import json
          with open('/tmp/lifecycle-draft.json') as f:
              lifecycle = json.load(f)
          assert lifecycle['status'] == 1
          assert lifecycle['workingRevision'] is not None
          assert lifecycle['publishedRevision'] is None
          PY

          curl -fsS -b /tmp/scada-auth.cookie http://127.0.0.1:5080/api/engineering/persistence/ci-demo/revisions > /tmp/persistence-revisions.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-revisions.json') as f:
              revisions = json.load(f)
          with open('/tmp/current-engineering.json') as f:
              engineering = json.load(f)
          assert len(revisions) >= 1
          assert revisions[0]['projectKey'] == 'ci-demo'
          assert revisions[0]['engineeringSchemaVersion'] == engineering['schemaVersion']
          assert revisions[0]['basedOnRevision'] is None
          PY

          # The canonical First Project is intentionally empty. Populate this
          # disposable CI project explicitly through Engineering Preview/Apply
          # instead of relying on any hidden Demo seed.
          WORKSPACE_VERSION=$(python3 -c 'import json; print(json.load(open("/tmp/workspace-after-save.json"))["changeVersion"])')
          test "$WORKSPACE_VERSION" -ge 1

          # Derive the CI package from the live canonical First Project export.
          # Preserve its current schema/Authority/Dynamo envelope and overlay one
          # explicit Server Memory TAG so the persisted runtime is self-contained
          # and does not depend on the historical Demo/simulation fallback.
          curl -fsS -b /tmp/scada-auth.cookie http://127.0.0.1:5080/api/engineering/export/json > /tmp/first-project-engineering.json
          python3 - <<'PY'
          import json
          with open('/tmp/first-project-engineering.json') as f:
              current = json.load(f)
          assert current.get('authorityPolicyReference') is not None, current

          data_source_id = '95000000-0000-0000-0000-000000000001'
          tag_id = '95000000-0000-0000-0000-000000000002'
          alarm_id = '95000000-0000-0000-0000-000000000003'
          current['dataSources'] = [
              {
                  'id': data_source_id,
                  'key': 'ci.memory.server',
                  'name': 'CI Server Memory',
                  'driver': 'builtin.memory.server',
                  'enabled': True,
                  'metadata': {'owner': 'ci-fixture'}
              }
          ]
          current['tags'] = [
              {
                  'id': tag_id,
                  'name': 'CI Runtime Value',
                  'path': 'CI.Runtime.Value',
                  'dataType': 'double',
                  'source': 'ci.memory.server',
                  'address': None,
                  'engineeringUnit': '%',
                  'description': 'Disposable CI runtime/historian value',
                  'readOnly': False,
                  'scaleMinimum': 0,
                  'scaleMaximum': 100,
                  'historian': {
                      'enabled': True,
                      'strategy': 'change',
                      'deadband': None,
                      'periodMilliseconds': None,
                      'maximumPeriodMilliseconds': None
                  },
                  'metadata': {'owner': 'ci-fixture'},
                  'initialValue': {'dataType': 'double', 'value': 42.5},
                  'dataSourceId': data_source_id
              }
          ]
          current['alarms'] = [
              {
                  'id': alarm_id,
                  'name': 'CI Runtime High',
                  'tagId': tag_id,
                  'tagPath': 'CI.Runtime.Value',
                  'type': 'high',
                  'priority': 'high',
                  'setpoint': 90,
                  'digitalActiveValue': True,
                  'alarmClass': 'CI',
                  'area': 'CI',
                  'message': 'CI runtime value above 90',
                  'activationDelayMilliseconds': 0,
                  'requiresAcknowledgement': True,
                  'shelvingAllowed': True,
                  'enabled': True,
                  'metadata': {'owner': 'ci-fixture'}
              }
          ]
          with open('/tmp/ci-runtime-engineering.json', 'w') as f:
              json.dump(current, f)
          PY

          curl -fsS -b /tmp/scada-auth.cookie -X POST http://127.0.0.1:5080/api/engineering/import/json/preview \
            -H 'content-type: application/json' \
            --data-binary @/tmp/ci-runtime-engineering.json > /tmp/engineering-import-preview.json
          python3 - <<'PY'
          import json
          with open('/tmp/engineering-import-preview.json') as f:
              preview = json.load(f)
          assert preview['canApply'] is True, preview
          assert preview['errorCount'] == 0, preview
          PY

          curl -fsS -b /tmp/scada-auth.cookie -X POST http://127.0.0.1:5080/api/engineering/import/json/apply \
            -H 'content-type: application/json' \
            -H "x-elitescada-workspace-version: ${WORKSPACE_VERSION}" \
            --data-binary @/tmp/ci-runtime-engineering.json > /tmp/engineering-import-apply.json
          python3 - <<'PY'
          import json
          with open('/tmp/engineering-import-apply.json') as f:
              applied = json.load(f)
          assert not any(issue.get('isError') for issue in applied.get('issues', [])), applied
          PY

          curl -fsS -b /tmp/scada-auth.cookie -X POST http://127.0.0.1:5080/api/engineering/persistence/ci-demo/save \
            -H 'content-type: application/json' \
            -d '{"projectName":"CI Demo","savedBy":"github-actions-fixture"}' > /tmp/persistence-configured-save.json
          REVISION=$(python3 -c 'import json; print(json.load(open("/tmp/persistence-configured-save.json"))["revision"])')
          echo "Saved configured engineering revision ${REVISION}"
          test "$REVISION" -gt "$FIRST_REVISION"
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-configured-save.json') as f:
              saved = json.load(f)
          with open('/tmp/persistence-save.json') as f:
              first = json.load(f)
          assert saved['basedOnRevision'] == first['revision']['revision']
          PY

          curl -fsS -b /tmp/scada-auth.cookie -X POST http://127.0.0.1:5080/api/engineering/persistence/ci-demo/latest/preview > /tmp/persistence-preview.json
          cat /tmp/persistence-preview.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-preview.json') as f:
              result = json.load(f)
          assert result['preview']['canApply'] is True
          assert result['revision']['projectKey'] == 'ci-demo'
          PY

          curl -fsS -b /tmp/scada-auth.cookie -X POST "http://127.0.0.1:5080/api/engineering/persistence/ci-demo/revisions/${REVISION}/publish" \
            -H 'content-type: application/json' \
            -d '{"publishedBy":"github-actions"}' > /tmp/persistence-publish.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-publish.json') as f:
              result = json.load(f)
          assert result['publication']['publishedRevision'] == result['revision']['revision']
          assert result['lifecycle']['status'] == 2
          PY

          ACTIVATE_STATUS=$(curl -sS -b /tmp/scada-auth.cookie -o /tmp/persistence-activate.json -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/engineering/persistence/ci-demo/published/activate \
            -H 'content-type: application/json' \
            -d '{"activatedBy":"github-actions"}')
          cat /tmp/persistence-activate.json
          test "$ACTIVATE_STATUS" = "200"
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-activate.json') as f:
              result = json.load(f)
          lifecycle = result['lifecycle']
          assert result['activated'] is True
          assert lifecycle['status'] == 2
          assert lifecycle['runtimeStatus'] == 2
          assert lifecycle['activeRevision'] == lifecycle['publishedRevision']
          assert result['revision']['revision'] == lifecycle['activeRevision']
          PY

          # Runtime mutations require a server-owned logical Runtime session lease.
          # Admit this authenticated CI client as interactive against the committed
          # active Runtime, then carry the lease headers on the process-value write.
          RUNTIME_CLIENT_INSTANCE=ci-runtime-smoke
          SESSION_STATUS=$(curl -sS -b /tmp/scada-auth.cookie -o /tmp/runtime-session.json -w '%{http_code}' \
            -X POST http://127.0.0.1:5080/api/runtime/sessions \
            -H 'content-type: application/json' \
            -d "{\"clientInstanceId\":\"${RUNTIME_CLIENT_INSTANCE}\",\"connectionClass\":\"interactive\"}")
          cat /tmp/runtime-session.json
          test "$SESSION_STATUS" = "201"
          RUNTIME_SESSION_ID=$(python3 - <<'PY'
          import json
          with open('/tmp/runtime-session.json') as f:
              session = json.load(f)
          with open('/tmp/persistence-activate.json') as f:
              activation = json.load(f)
          assert session['requestedClass'] == 'interactive', session
          assert session['grantedClass'] == 'interactive', session
          assert session['capacityReserved'] is True, session
          assert session['runtime']['projectKey'] == 'ci-demo', session
          assert session['runtime']['revision'] == activation['revision']['revision'], session
          print(session['sessionId'])
          PY
          )

          # Initial Server Memory state is composed while the candidate Runtime
          # event gate is still closed. Produce one deliberate post-activation
          # process-value write through the normal authorized Runtime API so the
          # Historian assertion observes only committed active-runtime traffic.
          CI_RUNTIME_TAG_ID=95000000-0000-0000-0000-000000000002
          WRITE_STATUS=$(curl -sS -b /tmp/scada-auth.cookie -o /tmp/runtime-write.json -w '%{http_code}' \
            -X POST "http://127.0.0.1:5080/api/tags/${CI_RUNTIME_TAG_ID}/write" \
            -H 'content-type: application/json' \
            -H "X-EliteSCADA-Runtime-Session: ${RUNTIME_SESSION_ID}" \
            -H "X-EliteSCADA-Runtime-Client-Instance: ${RUNTIME_CLIENT_INSTANCE}" \
            -d '{"value":43.5}')
          cat /tmp/runtime-write.json || true
          test "$WRITE_STATUS" = "202"

          historian_ready=false
          for _ in $(seq 1 30); do
            curl -fsS -b /tmp/scada-auth.cookie http://127.0.0.1:5080/api/diagnostics/runtime > /tmp/runtime-diagnostics.json
            if python3 - <<'PY'
          import json, sys
          with open('/tmp/runtime-diagnostics.json') as f:
              diagnostics = json.load(f)
          ok = (
              diagnostics['runtime']['projectKey'] == 'ci-demo'
              and diagnostics['runtime']['tagCount'] >= 1
              and diagnostics['historian']['provider'] == 'timescaledb'
              and diagnostics['historian']['writtenSamples'] >= 1
          )
          sys.exit(0 if ok else 1)
          PY
            then
              historian_ready=true
              break
            fi
            sleep 1
          done

          if [ "$historian_ready" != "true" ]; then
            cat /tmp/runtime-diagnostics.json
            cat /tmp/scada-api.log
            exit 1
          fi

          cat /tmp/secure-health.json
          cat /tmp/runtime-diagnostics.json
          curl -fsS -b /tmp/scada-auth.cookie http://127.0.0.1:5080/api/tags > /tmp/tags.json
          TAG_COUNT=$(python3 -c 'import json; print(len(json.load(open("/tmp/tags.json"))))')
          echo "Runtime exposed ${TAG_COUNT} TAGs"
          test "$TAG_COUNT" -ge 1

          CI_TAG_ID=$(python3 - <<'PY'
          import json
          with open('/tmp/tags.json') as f:
              tags = json.load(f)
          print(next(tag['id'] for tag in tags if tag['path'] == 'CI.Runtime.Value'))
          PY
          )
          echo "Historian smoke selected CI_TAG_ID=${CI_TAG_ID}"
          cat /tmp/tags.json
          curl -fsS -b /tmp/scada-auth.cookie "http://127.0.0.1:5080/api/history/${CI_TAG_ID}?limit=100" > /tmp/history.json
          curl -fsS -b /tmp/scada-auth.cookie http://127.0.0.1:5080/api/diagnostics/runtime > /tmp/runtime-diagnostics-history.json
          cat /tmp/history.json
          cat /tmp/runtime-diagnostics-history.json
          PGPASSWORD=postgres psql \
            --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres \
            --no-align --tuples-only --pset pager=off \
            --command="SELECT current_database(), current_schema(), now(), current_setting('TimeZone'); SELECT tag_id, COUNT(*) AS samples, MIN(ts) AS first_ts, MAX(ts) AS last_ts FROM elitescada.tag_history GROUP BY tag_id ORDER BY tag_id; SELECT tag_id, ts, quality, source, value, data_type FROM elitescada.tag_history WHERE tag_id = '${CI_TAG_ID}' AND ts >= now() - interval '15 minutes' ORDER BY ts;" || true
          python3 - <<'PY'
          import json
          with open('/tmp/history.json') as f:
              history = json.load(f)
          assert len(history) >= 1
          assert all(sample['quality'] == 0 for sample in history)
          PY

          curl -fsS -b /tmp/scada-auth.cookie -X POST http://127.0.0.1:5080/api/historical/query \
            -H 'content-type: application/json' \
            -d '{"datasetKey":"historian.samples","timeRange":{"kind":"relative","durationSeconds":300,"anchor":"now"},"page":{"limit":5}}' \
            > /tmp/historical-query.json
          cat /tmp/historical-query.json
          python3 - <<'PY'
          import json
          with open('/tmp/historical-query.json') as f:
              result = json.load(f)
          assert result['version'] == 1
          assert result['datasetKey'] == 'historian.samples'
          assert result['pageSize'] == 5
          assert result['fromUtc'] < result['toUtc']
          assert len(result['rows']) >= 1
          assert {column['field'] for column in result['columns']} >= {'tag.id', 'tag.path', 'timestamp', 'value', 'quality'}
          PY

          curl -fsS -b /tmp/scada-auth.cookie -X POST http://127.0.0.1:5080/api/engineering/persistence/ci-demo/save \
            -H 'content-type: application/json' \
            -d '{"projectName":"CI Demo","savedBy":"github-actions-after-publish"}' > /tmp/persistence-save-2.json
          python3 - <<'PY'
          import json
          with open('/tmp/persistence-configured-save.json') as f:
              active = json.load(f)
          with open('/tmp/persistence-save-2.json') as f:
              second = json.load(f)
          assert second['revision'] > active['revision']
          assert second['basedOnRevision'] == active['revision']
          PY

          curl -fsS -b /tmp/scada-auth.cookie http://127.0.0.1:5080/api/engineering/workspace > /tmp/workspace-after-save-2.json
          python3 - <<'PY'
          import json
          with open('/tmp/workspace-after-save-2.json') as f:
              workspace = json.load(f)
          with open('/tmp/persistence-save-2.json') as f:
              saved = json.load(f)
          assert workspace['baseRevision'] == saved['revision']
          assert workspace['isDirty'] is False
          PY

          curl -fsS -b /tmp/scada-auth.cookie http://127.0.0.1:5080/api/engineering/persistence/ci-demo/lifecycle > /tmp/lifecycle-pending.json
          python3 - <<'PY'
          import json
          with open('/tmp/lifecycle-pending.json') as f:
              lifecycle = json.load(f)
          assert lifecycle['status'] == 3
          assert lifecycle['workingRevision'] > lifecycle['publishedRevision']
          PY

  frontend:
    name: Web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install dependencies
        working-directory: web/scada-web
        run: npm ci --no-audit --no-fund

      - name: Build React/Vite
        working-directory: web/scada-web
        run: npm run build

  e2e:
    name: Chromium integration gate
    # This job is self-contained: Playwright starts its own API/Vite servers.
    # Do not serialize it behind backend/frontend; that only adds idle wall time.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.29.2-pg18
        env:
          POSTGRES_DB: elitescada_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elitescada_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__EliteScada: 'Host=127.0.0.1;Port=5432;Database=elitescada_e2e;Username=postgres;Password=postgres;Pooling=false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Restore backend
        run: dotnet restore ScadaPlatform.sln

      - name: Install frontend dependencies
        working-directory: web/scada-web
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: web/scada-web
        run: npx playwright install --with-deps chromium

      - name: Run Wave 15 merge integration smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/wave15/corrections-integration'
        working-directory: web/scada-web
        run: >-
          npm run test:e2e --
          tests-e2e/wave-03-integrated-composition.spec.ts
          tests-e2e/interface-wave-03-readiness.spec.ts
          tests-e2e/runtime.spec.ts
          tests-e2e/media-active-revision.spec.ts
          tests-e2e/static-artwork-library-insertion.spec.ts

      - name: Run full browser E2E tests
        if: github.event_name != 'push' || github.ref != 'refs/heads/wave15/corrections-integration'
        working-directory: web/scada-web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/scada-web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
