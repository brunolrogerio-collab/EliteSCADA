<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1119" />
    <meta name="robots" content="noindex, nofollow" />
    <title data-pt="Demonstração interativa SCADIVO" data-en="SCADIVO interactive demo">Demonstração interativa SCADIVO</title>
    <script src="site.js?v=20261023-es-final" defer></script>
    <style>
      :root {
        color-scheme: dark;
        background: #0b1119;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      main,
      iframe {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #0b1119;
      }

      main {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b1119;
      }

      iframe {
        display: block;
        border: 0;
        background: #0b1119;
      }

      .fallback {
        position: fixed;
        inset: auto 1rem 1rem;
        z-index: -1;
        color: #aebdce;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main aria-label="Demonstração interativa SCADIVO" data-pt="Demonstração interativa SCADIVO" data-en="SCADIVO interactive demo" data-translate-attribute="aria-label">
      <p class="fallback" data-pt="Carregando a demonstração SCADIVO…" data-en="Loading the SCADIVO demo…">Carregando a demonstração SCADIVO…</p>
      <iframe
        src="https://scadivo-demo.jywwfm.easypanel.host/"
        title="Demonstração interativa SCADIVO" data-pt="Demonstração interativa SCADIVO" data-en="SCADIVO interactive demo" data-translate-attribute="title"
        allow="fullscreen"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </main>
  </body>
</html>
