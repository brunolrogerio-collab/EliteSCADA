name: EliteSCADA npm lock candidate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lockfile:
    name: Generate npm lock candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Generate lockfile
        working-directory: web/scada-web
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Upload lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: npm-lock-candidate
          path: web/scada-web/package-lock.json
          if-no-files-found: error
          retention-days: 1
