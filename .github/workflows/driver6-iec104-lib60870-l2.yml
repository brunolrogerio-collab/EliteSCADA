name: Driver 6 IEC-104 lib60870 L2 Interop Smoke

on:
  pull_request:
    paths:
      - 'src/Scada.Drivers/Iec60870/**'
      - 'tests/Scada.Drivers.Tests/Iec104Lib60870L2IntegrationTests.cs'
      - 'interop-lab/iec104-lib60870/**'
      - 'interop-lab/compose.iec104-lib60870.yaml'
      - '.github/workflows/driver6-iec104-lib60870-l2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iec104-lib60870-l2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELITESCADA_IEC104_L2_HOST: 127.0.0.1
      ELITESCADA_IEC104_L2_PORT: 2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate lib60870 Compose model
        run: docker compose -f interop-lab/compose.iec104-lib60870.yaml config >/dev/null

      - name: Build and start independent lib60870 peer
        run: docker compose -f interop-lab/compose.iec104-lib60870.yaml up -d --build --wait --wait-timeout 120

      - name: Restore Driver 6 integration tests
        run: dotnet restore tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj

      - name: EliteSCADA Driver 6 against lib60870 peer
        run: dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj --no-restore --configuration Release --filter Category=Iec104Lib60870Integration --logger "console;verbosity=normal"

      - name: Show IEC-104 peer status
        if: always()
        run: docker compose -f interop-lab/compose.iec104-lib60870.yaml ps

      - name: Dump IEC-104 peer logs on failure
        if: failure()
        run: docker compose -f interop-lab/compose.iec104-lib60870.yaml logs --no-color

      - name: Stop IEC-104 peer
        if: always()
        run: docker compose -f interop-lab/compose.iec104-lib60870.yaml down -v --remove-orphans
