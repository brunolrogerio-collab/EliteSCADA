<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280" width="100%" height="100%"><defs><!-- Padrão de Hachura para a estrutura de concreto/metal --><pattern id="clarifier-hatch-2" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="1.5" /></pattern><!-- Novo Gradiente para o fluido interno (Marrom Escuro -> Alaranjado -> Amarelo) --><linearGradient id="fluid-gradient-brown" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#802000" /><stop offset="30%" stop-color="#A05000" /><stop offset="65%" stop-color="#D48806" /><stop offset="100%" stop-color="#FFEB3B" /></linearGradient></defs><!-- Grupo Geral com contornos pretos e fundo transparente --><g stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none"><!-- 1. FLUIDO INTERNO (Preenchimento com o novo gradiente marrom/alaranjado) --><path d="M 50 110              L 400 110              L 400 170              L 320 205              L 245 205              L 245 250              L 205 250              L 205 205              L 130 205              L 50 170 Z" fill="url(#fluid-gradient-brown)" stroke="none" /><!-- 2. ESTRUTURA DO TANQUE (Concreto Hachurado) --><path d="M 40 85 L 50 85 L 50 170 L 130 205 L 205 205 L 205 250 L 245 250 L 245 205 L 320 205 L 400 170 L 400 85 L 410 85 L 410 180 L 325 215 L 255 215 L 255 260 L 195 260 L 195 215 L 125 215 L 40 180 Z" fill="url(#clarifier-hatch-2)" /><!-- Calhas Coletoras Laterais Esquerda e Direita --><path d="M 50 100 L 75 100 L 75 125 L 60 125 L 60 110 L 50 110 Z" fill="url(#clarifier-hatch-2)" /><path d="M 400 100 L 375 100 L 375 125 L 390 125 L 390 110 L 400 110 Z" fill="url(#clarifier-hatch-2)" /><!-- 3. ESTRUTURAS INTERNAS (Pilares e Raspadeiras) --><!-- Colunas verticais centrais --><rect x="212" y="85" width="10" height="165" fill="#FFFFFF" /><rect x="228" y="85" width="10" height="165" fill="#FFFFFF" /><!-- Hastes verticais das raspadeiras --><g stroke-width="1.5"><line x1="120" y1="120" x2="120" y2="175" /><line x1="150" y1="120" x2="150" y2="185" /><line x1="180" y1="120" x2="180" y2="195" /><line x1="270" y1="120" x2="270" y2="195" /><line x1="300" y1="120" x2="300" y2="185" /><line x1="330" y1="120" x2="330" y2="175" /></g><!-- Braços Horizontais/Inclinados das Raspadeiras (Laranja) --><g fill="#E67E22"><!-- Lado Esquerdo --><rect x="110" y="115" width="80" height="6" /><path d="M 110 173 L 190 197 L 190 203 L 110 179 Z" /><!-- Lado Direito --><rect x="260" y="115" width="80" height="6" /><path d="M 260 197 L 340 173 L 340 179 L 260 203 Z" /></g><!-- 4. PASSARELA SUPERIOR (Guarda-corpo) --><!-- Colunas de sustentação da passarela para o tanque --><g stroke-width="1.5"><line x1="85" y1="65" x2="85" y2="85" /><line x1="125" y1="65" x2="125" y2="85" /><line x1="165" y1="65" x2="165" y2="85" /><line x1="205" y1="65" x2="205" y2="85" /><line x1="245" y1="65" x2="245" y2="85" /><line x1="285" y1="65" x2="285" y2="85" /><line x1="325" y1="65" x2="325" y2="85" /><line x1="365" y1="65" x2="365" y2="85" /></g><!-- Gradeamento horizontal e vertical do guarda-corpo --><rect x="40" y="45" width="370" height="20" fill="#7F8C8D" stroke-width="2" /><line x1="40" y1="55" x2="410" y2="55" stroke-width="1.5" /><!-- Divisórias verticais da grade --><g stroke-width="1.5"><line x1="40" y1="45" x2="40" y2="65" /><line x1="77" y1="45" x2="77" y2="65" /><line x1="114" y1="45" x2="114" y2="65" /><line x1="151" y1="45" x2="151" y2="65" /><line x1="188" y1="45" x2="188" y2="65" /><line x1="225" y1="45" x2="225" y2="65" /><line x1="262" y1="45" x2="262" y2="65" /><line x1="299" y1="45" x2="299" y2="65" /><line x1="336" y1="45" x2="336" y2="65" /><line x1="373" y1="45" x2="373" y2="65" /><line x1="410" y1="45" x2="410" y2="65" /></g></g></svg>
