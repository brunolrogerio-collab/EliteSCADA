name: Wave 14 C03 DNP3 Adapter

on:
  workflow_dispatch:
  push:
    branches:
      - wave14/c03-dnp3-unrestricted-adapter
    paths:
      - "src/Scada.Drivers.Dnp3.OpenDnp3/**"
      - "src/Scada.Drivers/Dnp3/**"
      - "tests/Scada.Drivers.Tests/**"
      - "native/dnp3/**"
      - "interop-lab/dnp3-dnp3py/**"
      - "interop-lab/compose.dnp3.yaml"
      - "docs/WAVE14-C03-DNP3-PRODUCTION-ADAPTER.md"
      - ".github/workflows/wave14-c03-dnp3.yml"
  pull_request:
    branches:
      - wave14/corrections-integration
    paths:
      - "src/Scada.Drivers.Dnp3.OpenDnp3/**"
      - "src/Scada.DriverHost/**"
      - "src/Scada.Drivers/Dnp3/**"
      - "tests/Scada.Drivers.Tests/**"
      - "native/dnp3/**"
      - "interop-lab/dnp3-dnp3py/**"
      - "interop-lab/compose.dnp3.yaml"
      - "docs/WAVE14-C03-DNP3-PRODUCTION-ADAPTER.md"
      - ".github/workflows/wave14-c03-dnp3.yml"

permissions:
  contents: read

jobs:
  managed-spike:
    name: Managed adapter build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore DNP3 tests
        run: dotnet restore tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj

      - name: Build DNP3 tests
        run: dotnet build tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj --no-restore --configuration Release

      - name: Run OpenDNP3 managed protocol tests
        run: dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj --no-build --configuration Release --filter FullyQualifiedName~OpenDnp3HostProtocolTests --verbosity normal

      - name: Run DNP3 convergence tests
        run: dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj --no-build --configuration Release --filter FullyQualifiedName~Dnp3CoordinatorConvergenceTests --verbosity normal

  native-linux:
    name: Native OpenDNP3 host build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pinned OpenDNP3 host
        run: cmake -S native/dnp3 -B build/dnp3 -DCMAKE_BUILD_TYPE=Release

      - name: Build native host
        run: cmake --build build/dnp3 --config Release --target EliteScada.Dnp3Host --parallel 2

      - name: Verify native host artifact
        run: test -x build/dnp3/EliteScada.Dnp3Host

      - name: Upload Linux native host
        uses: actions/upload-artifact@v4
        with:
          name: c03-opendnp3-linux-x64
          path: build/dnp3/EliteScada.Dnp3Host
          if-no-files-found: error
          retention-days: 2

  dnp3py-interop:
    name: OpenDNP3 to dnp3py L3 interop
    needs: native-linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELITESCADA_L3_DNP3_HOST: 127.0.0.1
      ELITESCADA_L3_DNP3_PORT: "20000"
      ELITESCADA_DNP3_HOST_PATH: ${{ github.workspace }}/build/dnp3/EliteScada.Dnp3Host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Download Linux native host
        uses: actions/download-artifact@v4
        with:
          name: c03-opendnp3-linux-x64
          path: build/dnp3

      - name: Prepare native host
        run: chmod +x build/dnp3/EliteScada.Dnp3Host

      - name: Start independent dnp3py outstation
        working-directory: interop-lab
        run: docker compose -f compose.yaml -f compose.dnp3.yaml up -d --build --wait --wait-timeout 180 dnp3-dnp3py

      - name: Verify DNP3 peer endpoint
        run: timeout 20 bash -c 'until nc -z 127.0.0.1 20000; do sleep 1; done'

      - name: Restore DNP3 tests
        run: dotnet restore tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj

      - name: Build DNP3 tests
        run: dotnet build tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj --no-restore --configuration Release

      - name: Run real OpenDNP3/dnp3py interop
        run: dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj --no-build --configuration Release --filter Category=L3OpenDnp3Integration --logger "console;verbosity=normal" --logger "trx;LogFileName=c03-opendnp3-dnp3py.trx" --results-directory TestResults/C03OpenDnp3

      - name: Show dnp3py logs
        if: always()
        run: docker logs elitescada-lab-dnp3-dnp3py || true

      - name: Upload L3 interop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-opendnp3-dnp3py-results-${{ github.sha }}
          path: TestResults/C03OpenDnp3/**
          if-no-files-found: warn
          retention-days: 14

      - name: Stop DNP3 peer
        if: always()
        working-directory: interop-lab
        run: docker compose -f compose.yaml -f compose.dnp3.yaml down -v

  native-windows:
    name: Native OpenDNP3 host build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure pinned OpenDNP3 host
        shell: pwsh
        run: cmake -S native/dnp3 -B build/dnp3 -A x64

      - name: Build native host
        shell: pwsh
        run: cmake --build build/dnp3 --config Release --target EliteScada.Dnp3Host --parallel 2

      - name: Inspect native dependency graph
        shell: pwsh
        run: |
          $exe = Resolve-Path 'build/dnp3/Release/EliteScada.Dnp3Host.exe'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ toolchain was not found.' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $command = '"' + $vcvars + '" && dumpbin /DEPENDENTS "' + $exe.Path + '"'
          $dependencies = cmd /c $command
          $dependencies | Tee-Object -FilePath build/dnp3/windows-dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin dependency inspection failed.' }
          if ($dependencies -match '(?i)(libssl|libcrypto|opendnp3\.dll)') {
            throw 'Windows DNP3 host unexpectedly depends on OpenSSL or a shared OpenDNP3 DLL.'
          }
          Get-FileHash $exe.Path -Algorithm SHA256 | Format-List | Out-File build/dnp3/windows-sha256.txt
          Get-Content build/dnp3/windows-sha256.txt

      - name: Upload Windows native host evidence
        uses: actions/upload-artifact@v4
        with:
          name: c03-opendnp3-windows-x64
          path: |
            build/dnp3/Release/EliteScada.Dnp3Host.exe
            build/dnp3/windows-dependencies.txt
            build/dnp3/windows-sha256.txt
          if-no-files-found: error
          retention-days: 14
