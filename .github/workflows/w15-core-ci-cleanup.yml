name: W15 Core CI Cleanup Verification

on:
  push:
    branches:
      - work/w15-driver-lifecycle-ha-gate
    paths:
      - tests/Scada.Core.Tests/HomeCommonS1EngineeringTests.cs
      - tests/Scada.Core.Tests/R2SharedWireContractTests.cs
      - .github/workflows/w15-core-ci-cleanup.yml

permissions:
  contents: read
  issues: write

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Full Scada.Core.Tests regression
        id: core_tests
        continue-on-error: true
        run: >-
          dotnet test tests/Scada.Core.Tests/Scada.Core.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=core-ci-cleanup.trx"
          --results-directory TestResults/CoreCleanup
          --verbosity normal

      - name: Publish Core cleanup evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.core_tests.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >/tmp/core-cleanup.md
          import json, os, pathlib, xml.etree.ElementTree as ET
          counts = {"total":"NA","passed":"NA","failed":"NA","notExecuted":"NA"}
          path = pathlib.Path("TestResults/CoreCleanup/core-ci-cleanup.trx")
          if path.exists():
              root = ET.parse(path).getroot()
              for el in root.iter():
                  if el.tag.endswith("Counters"):
                      counts.update({k:el.attrib.get(k,"NA") for k in counts})
                      break
          print("## MAIN/CI — full Core cleanup verification")
          print(f"- run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          print(f"- head: `{os.environ['GITHUB_SHA']}`")
          print(f"- outcome: **{os.environ['TEST_OUTCOME']}**")
          print("- counters: " + json.dumps(counts))
          print("- verifies the two stale schema-version assertions exposed by post-#559 CI run 37728494066.")
          PY
          gh api repos/${GITHUB_REPOSITORY}/issues/560/comments --method POST -f body="$(cat /tmp/core-cleanup.md)"

      - name: Enforce Core cleanup
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.core_tests.outcome }}
        run: test "$TEST_OUTCOME" = "success"
