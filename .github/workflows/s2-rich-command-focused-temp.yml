name: TEMP S2 Rich Command focused CI

on:
  push:
    branches:
      - work/driver-interaction-s2-rich-command-runtime

permissions:
  contents: read

jobs:
  rich-command-focused:
    name: RichCommandRuntimeServiceTests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup repository .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore repository
        run: dotnet restore ScadaPlatform.sln

      - name: Run focused Rich Command Runtime tests
        run: >
          dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~RichCommandRuntimeServiceTests"
          --logger "console;verbosity=normal"
