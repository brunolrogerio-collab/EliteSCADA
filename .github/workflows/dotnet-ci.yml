name: .NET CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.sln'
      - '**/*.csproj'
      - '**/*.cs'
      - '**/*.json'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect .NET solution
        id: detect
        shell: bash
        run: |
          if [ -f 'ScadaPlatform.sln' ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "ScadaPlatform.sln not found. CI will exit successfully."
          fi

      - name: Setup .NET 10
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.detect.outputs.found == 'true'
        run: dotnet restore ScadaPlatform.sln

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: dotnet build ScadaPlatform.sln --no-restore --configuration Release

      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: dotnet test ScadaPlatform.sln --no-build --configuration Release --verbosity normal
