<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 680" width="100%" height="100%"><defs><!-- Gradiente metálico para o cilindro central --><linearGradient id="cylinder-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#a8a8a8" /><stop offset="15%" stop-color="#dcdcdc" /><stop offset="50%" stop-color="#ffffff" /><stop offset="85%" stop-color="#e0e0e0" /><stop offset="100%" stop-color="#949494" /></linearGradient><!-- Gradiente para os botões/detalhes azuis --><linearGradient id="blue-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#60a5fa" /><stop offset="100%" stop-color="#2563eb" /></linearGradient></defs><!-- Estilos para reaproveitamento de bordas --><!-- ==================== CAMADA TRASEIRA / SUPORTES ==================== --><!-- Torre vertical superior esquerda --><rect x="294" y="44" width="66" height="136" fill="#7a7a7a" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Haste preta com topo arredondado acima da torre --><path d="M 320,44 L 320,18 M 310,18 L 344,18 M 316,14 C 316,8, 338,8, 338,14 Z" stroke="#000000" stroke-width="3" fill="#000000" /><!-- Linha fina vertical paralela à torre --><line x1="366" y1="44" x2="366" y2="180" stroke="#000000" stroke-width="2" /><!-- Suporte mecânico inferior esquerdo (abaixo do cilindro principal) --><path d="M 284,416 L 434,416 L 434,436 L 274,436 L 274,580 L 240,580 L 240,416 Z" fill="#9e9e9e" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><rect x="290" y="448" width="6" height="78" fill="#000000" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><rect x="372" y="448" width="6" height="78" fill="#000000" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><rect x="290" y="526" width="88" height="24" fill="#000000" /><!-- Perna de sustentação esquerda --><path d="M 204,416 L 240,416 L 240,594 L 204,594 Z" fill="#9e9e9e" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Perna de sustentação direita --><rect x="656" y="408" width="46" height="202" fill="#9e9e9e" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Sapatas Azuis dos Pés --><!-- Esquerda --><path d="M 190,610 L 254,610 L 246,594 L 198,594 Z" fill="url(#blue-grad)" stroke="#000000" stroke-width="1.5" /><rect x="178" y="610" width="78" height="8" fill="url(#blue-grad)" stroke="#000000" stroke-width="1.5" /><!-- Direita --><path d="M 640,610 L 704,610 L 696,594 L 648,594 Z" fill="url(#blue-grad)" stroke="#000000" stroke-width="1.5" /><rect x="628" y="610" width="78" height="8" fill="url(#blue-grad)" stroke="#000000" stroke-width="1.5" /><!-- ==================== CILINDRO CENTRAL E DETALHES ==================== --><!-- Cilindro Metálico Principal --><rect x="240" y="192" width="510" height="200" fill="url(#cylinder-grad)" /><!-- Linhas limítrofes do cilindro para manter o contorno nas pontas --><line x1="240" y1="192" x2="750" y2="192" stroke="#000000" stroke-width="1.5" /><line x1="240" y1="392" x2="750" y2="392" stroke="#000000" stroke-width="1.5" /><!-- Pequenos anéis/olhais no topo do cilindro --><circle cx="400" cy="174" r="10" fill="none" stroke="#000000" stroke-width="2" /><circle cx="688" cy="174" r="10" fill="none" stroke="#000000" stroke-width="2" /><!-- Abraçadeiras/Suportes verticais claros sobre o cilindro --><rect x="366" y="286" width="16" height="106" fill="#c2c2c2" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><rect x="394" y="286" width="16" height="106" fill="#c2c2c2" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><rect x="638" y="290" width="16" height="102" fill="#c2c2c2" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><rect x="666" y="290" width="16" height="102" fill="#c2c2c2" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- ==================== COMPONENTES DA ESQUERDA ==================== --><!-- Painel frontal angulado (extrema esquerda) --><path d="M 140,248 L 240,248 L 240,416 L 198,416 L 140,314 Z" fill="#9e9e9e" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Alça ou bocal inclinado saindo da lateral esquerda --><path d="M 140,290 L 114,306 L 122,318 L 140,302 Z" fill="#9e9e9e" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><rect x="104" y="300" width="14" height="14" transform="rotate(-30 104 300)" fill="#9e9e9e" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Bloco cinza médio intermediário superior esquerdo --><rect x="166" y="176" width="74" height="72" fill="#9e9e9e" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Círculo azul superior esquerdo --><circle cx="202" cy="214" r="22" fill="url(#blue-grad)" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Peça em formato de cunha/triângulo truncado ao lado da torre --><path d="M 250,176 L 284,176 L 284,286 L 266,286 L 250,254 Z" fill="#9e9e9e" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Retângulo cinza escuro sobreposto no centro-esquerdo --><rect x="294" y="302" width="60" height="90" fill="#7a7a7a" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- ==================== COMPONENTES DA DIREITA ==================== --><!-- Bloco/Gabinete grande na extrema direita --><path d="M 700,162 L 750,162 L 750,178 L 974,178 L 974,380 L 916,432 L 770,432 L 770,392 L 700,392 Z" fill="#9e9e9e" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Detalhe/Recorte cinza escuro sob o gabinete direito --><path d="M 714,364 L 758,364 L 758,414 L 730,414 L 714,394 Z" fill="#7a7a7a" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- ==================== CÍRCULOS AZUIS (SEM TEXTO) ==================== --><!-- Círculo Azul 1 --><circle cx="466" cy="286" r="38" fill="url(#blue-grad)" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /><!-- Círculo Azul 2 --><circle cx="620" cy="286" r="38" fill="url(#blue-grad)" stroke-width="1.5" stroke="#000000" stroke-linejoin="round" /></svg>
