name: Driver 6 IEC-104 L2 Interop Smoke

on:
  pull_request:
    paths:
      - 'src/Scada.Drivers/Iec60870/**'
      - 'tests/Scada.Drivers.Tests/Iec104L2*.cs'
      - 'interop-lab/compose.iec104-driver6.yaml'
      - 'interop-lab/iec104/driver6-server/**'
      - '.github/workflows/driver6-iec104-l2-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iec104-l2-lifecycle-gi-command-reconnect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELITESCADA_IEC104_L2_HOST: 127.0.0.1
      ELITESCADA_IEC104_L2_PORT: 2404
      ELITESCADA_IEC104_L2_RESTART_CONTAINER: elitescada-lab-iec104-driver6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate IEC-104 peer Compose model
        run: docker compose -f interop-lab/compose.iec104-driver6.yaml config >/dev/null

      - name: Build and start independent IEC-104 peer
        run: docker compose -f interop-lab/compose.iec104-driver6.yaml up -d --build --wait --wait-timeout 120

      - name: Restore Driver 6 integration tests
        run: dotnet restore tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj

      - name: EliteSCADA Driver 6 against independent lib60870 peer
        run: dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj --no-restore --configuration Release --filter Category=Iec104L2Integration --logger "console;verbosity=normal"

      - name: Show IEC-104 peer status
        if: always()
        run: docker compose -f interop-lab/compose.iec104-driver6.yaml ps

      - name: Dump IEC-104 peer logs on failure
        if: failure()
        run: docker compose -f interop-lab/compose.iec104-driver6.yaml logs --no-color

      - name: Stop IEC-104 peer
        if: always()
        run: docker compose -f interop-lab/compose.iec104-driver6.yaml down -v --remove-orphans
