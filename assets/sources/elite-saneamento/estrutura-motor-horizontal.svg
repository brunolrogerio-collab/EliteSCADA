<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%"><defs><!-- Gradiente metálico horizontal (para a viga principal) --><linearGradient id="metal-v" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#b8b8b8" /><stop offset="30%" stop-color="#ffffff" /><stop offset="70%" stop-color="#e0e0e0" /><stop offset="100%" stop-color="#949494" /></linearGradient><!-- Gradiente metálico vertical (para as pernas/rolos) --><linearGradient id="metal-h" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8a8a8a" /><stop offset="25%" stop-color="#ffffff" /><stop offset="75%" stop-color="#e0e0e0" /><stop offset="100%" stop-color="#737373" /></linearGradient><!-- Gradiente para o motor da direita --><linearGradient id="motor-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5a5a5a" /><stop offset="50%" stop-color="#8c8c8c" /><stop offset="100%" stop-color="#404040" /></linearGradient></defs><!-- Estilos gerais para bordas --><!-- 1. Estrutura Preta Fixa (Canto Superior Esquerdo) --><path d="M 0,28 L 36,28 M 36,0 L 36,200 M 36,174 L 114,174" stroke-width="24" stroke="#000000" stroke-linecap="square" fill="none" /><!-- 2. Caixa Cinza de Suporte Esquerda (atrás do cilindro azul) --><rect x="36" y="226" width="114" height="62" fill="#d1d5db" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><!-- 3. Detalhe Azul (Botão/Rolamento Esquerdo) --><circle cx="100" cy="257" r="26" fill="#3b82f6" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><!-- 4. Perna/Rolo Esquerdo --><rect x="154" y="152" width="60" height="316" fill="url(#metal-h)" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><!-- 5. Caixa Cinza Escuro Inferior Direita (atrás) --><rect x="850" y="226" width="60" height="52" fill="#5a6169" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><!-- 6. Perna/Rolo Direito --><rect x="726" y="152" width="60" height="316" fill="url(#metal-h)" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><!-- 7. Viga Principal Superior --><rect x="114" y="98" width="804" height="128" fill="url(#metal-v)" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><!-- 8. Painel Retangular Interno (Esquerda) --><rect x="226" y="158" width="120" height="56" fill="#8c92ac" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><!-- 9. Acoplamento do Motor (Direita) --><polygon points="918,136 942,126 942,188 918,178" fill="#737373" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><!-- 10. Conjunto do Motor Elétrico (Extrema Direita) --><rect x="942" y="104" width="56" height="106" fill="url(#motor-grad)" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><rect x="998" y="116" width="12" height="82" fill="#404040" stroke-width="2" stroke-linejoin="round" stroke="#000000" /><path d="M 952,210 L 988,210 M 970,210 L 970,246 M 948,246 L 992,246" stroke="#000000" stroke-width="4" fill="none" /><rect x="948" y="246" width="44" height="8" fill="#404040" stroke-width="2" stroke-linejoin="round" stroke="#000000" /></svg>
