services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg18
    environment:
      POSTGRES_DB: elitescada_preview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: preview-only-not-for-production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elitescada_preview"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - preview_db:/var/lib/postgresql

  preview:
    build:
      context: ../..
      dockerfile: ci/local/Dockerfile.linux-e2e
    working_dir: /workspace
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5080
      ConnectionStrings__EliteScada: Host=timescaledb;Port=5432;Database=elitescada_preview;Username=postgres;Password=preview-only-not-for-production;Pooling=false
      Authentication__Enabled: "true"
      Authentication__Jwt__Issuer: EliteSCADA.Preview.Local
      Authentication__Jwt__Audience: EliteSCADA.Preview.Local
      Authentication__Local__Enabled: "true"
      Historian__Provider: timescaledb
      HistoricalQuery__Enabled: "true"
      PREVIEW_RUNTIME_STATE_DIR: /preview-state
      PREVIEW_EVIDENCE_DIR: /preview-evidence
      SCADA_API_PROXY: http://127.0.0.1:5080
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - preview_runtime:/preview-state
      - ./artifacts/preview-audit-a:/preview-evidence
      - preview_nuget:/root/.nuget/packages
      - preview_node_modules:/workspace/web/scada-web/node_modules
    entrypoint: ["bash", "/workspace/scripts/preview/run-product-preview.sh"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 90s

volumes:
  preview_db:
  preview_runtime:
  preview_nuget:
  preview_node_modules:
