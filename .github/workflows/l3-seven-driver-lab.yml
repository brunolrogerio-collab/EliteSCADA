name: L3 Seven-Driver Lab

on:
  workflow_dispatch:
  push:
    branches:
      - coordination/driver-l3-seven-protocol-lab
    paths:
      - "src/**"
      - "tests/**"
      - "interop-lab/**"
      - ".github/workflows/l3-seven-driver-lab.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "interop-lab/**"
      - ".github/workflows/l3-seven-driver-lab.yml"

permissions:
  contents: read

jobs:
  heterogeneous-gateway-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELITESCADA_L3_S7_HOST: 127.0.0.1
      ELITESCADA_L3_S7_PORT: "1102"
      ELITESCADA_L3_CIP_HOST: 127.0.0.1
      ELITESCADA_L3_CIP_PORT: "44818"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Validate all lab Compose models
        working-directory: interop-lab
        run: |
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.cip.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.opcua.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.iec104.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.dnp3.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.s7.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.bacnet.yaml config >/dev/null

      - name: Start MQTT, CIP, OPC UA, IEC-104 and DNP3 peers
        working-directory: interop-lab
        run: >-
          docker compose
          -f compose.yaml
          -f compose.cip.yaml
          -f compose.opcua.yaml
          -f compose.iec104.yaml
          -f compose.dnp3.yaml
          up -d --build --wait --wait-timeout 180

      - name: Start S7 peer
        working-directory: interop-lab
        run: >-
          docker compose
          -f compose.yaml
          -f compose.s7.yaml
          up -d --build --wait --wait-timeout 120 s7-python-snap7

      - name: Start BACnet/IP peer
        working-directory: interop-lab
        run: >-
          docker compose
          -f compose.yaml
          -f compose.bacnet.yaml
          up -d --build --wait --wait-timeout 120 bacnet-bacpypes

      - name: Verify seven peer endpoints
        run: |
          timeout 20 bash -c 'until nc -z 127.0.0.1 1883; do sleep 1; done'
          timeout 20 bash -c 'until nc -z 127.0.0.1 44818; do sleep 1; done'
          timeout 20 bash -c 'until nc -z 127.0.0.1 4841; do sleep 1; done'
          timeout 20 bash -c 'until nc -z 127.0.0.1 2404; do sleep 1; done'
          timeout 20 bash -c 'until nc -z 127.0.0.1 20000; do sleep 1; done'
          timeout 20 bash -c 'until nc -z 127.0.0.1 1102; do sleep 1; done'
          timeout 20 bash -c 'until curl -fsS http://127.0.0.1:18080/health; do sleep 1; done'

      - name: Restore
        run: dotnet restore ScadaPlatform.sln

      - name: Build
        run: dotnet build ScadaPlatform.sln -c Release --no-restore

      - name: Run L3 heterogeneous TAG Gateway peer test
        run: >-
          dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj
          -c Release --no-build
          --filter "Category=L3GatewayIntegration"
          --logger "console;verbosity=normal"

      - name: Show seven-peer lab status
        if: always()
        working-directory: interop-lab
        run: >-
          docker compose
          -f compose.yaml
          -f compose.cip.yaml
          -f compose.opcua.yaml
          -f compose.iec104.yaml
          -f compose.dnp3.yaml
          -f compose.s7.yaml
          -f compose.bacnet.yaml
          ps

      - name: Dump lab logs on failure
        if: failure()
        working-directory: interop-lab
        run: >-
          docker compose
          -f compose.yaml
          -f compose.cip.yaml
          -f compose.opcua.yaml
          -f compose.iec104.yaml
          -f compose.dnp3.yaml
          -f compose.s7.yaml
          -f compose.bacnet.yaml
          logs --no-color || true

      - name: Stop seven-peer lab
        if: always()
        working-directory: interop-lab
        run: >-
          docker compose
          -f compose.yaml
          -f compose.cip.yaml
          -f compose.opcua.yaml
          -f compose.iec104.yaml
          -f compose.dnp3.yaml
          -f compose.s7.yaml
          -f compose.bacnet.yaml
          down -v --remove-orphans
