<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 320" width="100%" height="100%">
  <defs>
    <!-- Gradiente amarelo para o corpo principal -->
    <linearGradient id="yellow-motor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFB40" />
      <stop offset="70%" stop-color="#E6D319" />
      <stop offset="100%" stop-color="#B0A10B" />
    </linearGradient>
  </defs>
  <!-- Grupo Geral rotacionado a -40 graus para dar a inclinação exata da imagem -->
  <g transform="rotate(-40 160 160)" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Eixo Metálico -->
    <rect x="119" y="245" width="12" height="30" fill="#A9A9A9" />
    <ellipse cx="125" cy="245" rx="6" ry="2" fill="#7F7F7F" />
    <!-- Corpo Principal do Motor -->
    <rect x="40" y="30" width="170" height="220" rx="35" fill="url(#yellow-motor-grad)" />
    <!-- Ranhuras/Aletas de Refrigeração Verticais -->
    <g fill="#C7B614" stroke="#000000" stroke-width="1.5">
      <rect x="58" y="45" width="10" height="190" rx="4" />
      <rect x="83" y="45" width="10" height="190" rx="4" />
      <rect x="108" y="45" width="10" height="190" rx="4" />
      <rect x="133" y="45" width="10" height="190" rx="4" />
      <rect x="158" y="45" width="10" height="190" rx="4" />
      <rect x="183" y="45" width="10" height="190" rx="4" />
    </g>
    <!-- Caixa de Ligação Elétrica -->
    <rect x="85" y="95" width="115" height="100" fill="#FCFB40" />
  </g>
</svg>
