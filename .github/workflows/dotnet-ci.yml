name: EliteSCADA CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.sln'
      - '**/*.csproj'
      - '**/*.cs'
      - '**/*.json'
      - '**/*.props'
      - '**/*.targets'
      - 'global.json'
      - 'web/scada-web/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, test and smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ScadaPlatform.sln

      - name: Build
        run: dotnet build ScadaPlatform.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ScadaPlatform.sln --no-build --configuration Release --verbosity normal

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          export ASPNETCORE_URLS=http://127.0.0.1:5080
          dotnet run --project src/Scada.Api/Scada.Api.csproj --no-build --configuration Release --no-launch-profile > /tmp/scada-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/health > /tmp/health.json; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/scada-api.log
            exit 1
          fi

          cat /tmp/health.json
          TAG_COUNT=$(curl -fsS http://127.0.0.1:5080/api/tags | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "Runtime exposed ${TAG_COUNT} TAGs"
          test "$TAG_COUNT" -ge 7

  frontend:
    name: Web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: web/scada-web
        run: npm install --no-audit --no-fund

      - name: Build React/Vite
        working-directory: web/scada-web
        run: npm run build

  e2e:
    name: Chromium end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore backend
        run: dotnet restore ScadaPlatform.sln

      - name: Install frontend dependencies
        working-directory: web/scada-web
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: web/scada-web
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: web/scada-web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/scada-web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
