resolver 127.0.0.11 valid=10s;
map $http_x_forwarded_proto $portal_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}
upstream scadivo_portal {
  zone scadivo_portal 64k;
  server scadivo_portal_api:8080 resolve;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /portal { return 302 /portal/; }
  location ~ ^/(?:Dockerfile|nginx-default\.conf|README\.md|\.) { return 404; }
  location /portal/ {
    proxy_pass http://scadivo_portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
  }

  location = /demo {
    try_files /demo.html =404;
  }

  location = /demo/ {
    try_files /demo.html =404;
  }

  location = /contato { try_files /contact.html =404; }
  location = /contato/ { try_files /contact.html =404; }
  location = /contact { try_files /contact.html =404; }
  location = /contact/ { try_files /contact.html =404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
