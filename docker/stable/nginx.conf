map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker can recreate or restart API containers after this web container starts.
# Resolve the service name through Docker DNS continuously instead of pinning
# the first IP Nginx sees while loading its configuration.
upstream api_backend {
    zone api_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:5080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Nginx's bundled mime.types maps .js but not .mjs. Pyodide is loaded as
    # an ES module inside the isolated Python worker and browsers reject the
    # default application/octet-stream MIME type for module scripts.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /openapi/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api_backend/health;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Pyodide needs SharedArrayBuffer for interruptible Python execution.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
