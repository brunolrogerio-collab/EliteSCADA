services:
  opcua-peer:
    build:
      context: ./opcua/open62541
      dockerfile: Dockerfile
      args:
        OPEN62541_VERSION: "1.5.4"
        OPEN62541_C_SHA256: "9768d3f019ff67be0f9a815d0acd09a9e1906b0dcbb373512343aa41feecd87f"
        OPEN62541_H_SHA256: "b6edbc3b2d213927750af9774adc13f3bb9bbfa52199aa46f9e57cf657186afe"
    container_name: elitescada-lab-opcua-open62541
    ports:
      - "${OPCUA_PEER_PORT:-4841}:4840"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4840"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
    networks:
      - interop

  node-red:
    environment:
      LAB_OPCUA_ENDPOINT: "opc.tcp://opcua-peer:4840"
    volumes:
      - ./node-red/opcua-smoke.js:/data/opcua-smoke.js:ro
    depends_on:
      opcua-peer:
        condition: service_healthy
