name: W14 Package Freeze Materializer

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/wave14-package-freeze-materialize.yml'

permissions:
  actions: read
  contents: write

jobs:
  materialize-exact-run405-artifact:
    name: Materialize exact Wave11 #405 package bytes
    if: github.event.pull_request.head.ref == 'wave14/post-c26-runtime-package-freeze'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact freeze head branch
        uses: actions/checkout@v4
        with:
          ref: wave14/post-c26-runtime-package-freeze
          fetch-depth: 0

      - name: Download authoritative Wave11 #405 artifact
        uses: actions/download-artifact@v4
        with:
          name: EliteSCADA-EEE-Demo
          path: /tmp/elitescada-run405
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: brunolrogerio-collab/EliteSCADA
          run-id: 34389773212

      - name: Verify artifact identity before materialization
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/elitescada-run405
          sha256sum --check EliteSCADA-EEE-Demo.escadapkg.sha256
          ACTUAL_SHA="$(sha256sum EliteSCADA-EEE-Demo.escadapkg | awk '{print $1}')"
          [[ "$ACTUAL_SHA" == 'e995051b4744f904663350102683c886af9674aaae8fff1dbc76f294ff2d774d' ]]
          ACTUAL_GIT_BLOB="$(git hash-object EliteSCADA-EEE-Demo.escadapkg)"
          [[ "$ACTUAL_GIT_BLOB" == 'e42503e72ca9afc83b9474484f7b5e2c770e837b' ]]
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('EliteSCADA-EEE-Demo.provenance.json', 'utf8'));
          if (p.workflowRunId !== '34389773212' || p.workflowRunNumber !== '405') throw new Error('Unexpected generator workflow evidence');
          if (p.c11DemoCommitSha !== '38c4de56affd0e36edd7682d61aad0a53e11213e') throw new Error('Unexpected C11 generator SHA');
          if (p.sourceProductSha !== '08e2530671de10d48933c4b712a1a1abc9e41dce') throw new Error('Unexpected accepted C26 authoring source');
          if (p.packageSha256 !== 'e995051b4744f904663350102683c886af9674aaae8fff1dbc76f294ff2d774d') throw new Error('Unexpected package SHA-256 in provenance');
          NODE
          if unzip -Z1 EliteSCADA-EEE-Demo.escadapkg | grep -E '\.escadalib$'; then
            echo 'Authoritative artifact unexpectedly depends on .escadalib.' >&2
            exit 1
          fi

      - name: Replace frozen triplet with exact artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/elitescada-run405/EliteSCADA-EEE-Demo.escadapkg preview/fixtures/EliteSCADA-EEE-Demo.escadapkg
          cp /tmp/elitescada-run405/EliteSCADA-EEE-Demo.escadapkg.sha256 preview/fixtures/EliteSCADA-EEE-Demo.escadapkg.sha256
          cp /tmp/elitescada-run405/EliteSCADA-EEE-Demo.provenance.json preview/fixtures/EliteSCADA-EEE-Demo.provenance.json
          (cd preview/fixtures && sha256sum --check EliteSCADA-EEE-Demo.escadapkg.sha256)
          [[ "$(git hash-object preview/fixtures/EliteSCADA-EEE-Demo.escadapkg)" == 'e42503e72ca9afc83b9474484f7b5e2c770e837b' ]]

      - name: Commit exact bytes and remove one-shot materializer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/wave14-package-freeze-materialize.yml
          git add preview/fixtures/EliteSCADA-EEE-Demo.escadapkg \
                  preview/fixtures/EliteSCADA-EEE-Demo.escadapkg.sha256 \
                  preview/fixtures/EliteSCADA-EEE-Demo.provenance.json
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(w14-c11): materialize exact Wave11 #405 package bytes'
          git push origin HEAD:wave14/post-c26-runtime-package-freeze
