// Derived from the MIT-licensed ESPHome Native API protocol definition.
// Bounded Checkpoint 3 surface: entity listing/state/commands used by EliteSCADA.
// Unknown/additive fields remain protobuf-compatible and are intentionally ignored.
syntax = "proto3";
option csharp_namespace = "Scada.Drivers.ESPHome.Protocol.Generated";
package esphome.api;

message ListEntitiesRequest {}
message ListEntitiesDoneResponse {}
message SubscribeStatesRequest {}

message ListEntitiesBinarySensorResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  string device_class = 5;
  bool is_status_binary_sensor = 6;
  bool disabled_by_default = 7;
  string icon = 8;
  int32 entity_category = 9;
  uint32 device_id = 10;
}
message BinarySensorStateResponse {
  fixed32 key = 1;
  bool state = 2;
  bool missing_state = 3;
  uint32 device_id = 4;
}

message ListEntitiesCoverResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  bool assumed_state = 5;
  bool supports_position = 6;
  bool supports_tilt = 7;
  string device_class = 8;
  bool disabled_by_default = 9;
  string icon = 10;
  int32 entity_category = 11;
  bool supports_stop = 12;
  uint32 device_id = 13;
}
message CoverStateResponse {
  fixed32 key = 1;
  float position = 3;
  float tilt = 4;
  int32 current_operation = 5;
  uint32 device_id = 6;
}
message CoverCommandRequest {
  fixed32 key = 1;
  bool has_position = 4;
  float position = 5;
  bool has_tilt = 6;
  float tilt = 7;
  bool stop = 8;
  uint32 device_id = 9;
}

message ListEntitiesFanResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  bool supports_oscillation = 5;
  bool supports_speed = 6;
  bool supports_direction = 7;
  int32 supported_speed_count = 8;
  bool disabled_by_default = 9;
  string icon = 10;
  int32 entity_category = 11;
  repeated string supported_preset_modes = 12;
  uint32 device_id = 13;
}
message FanStateResponse {
  fixed32 key = 1;
  bool state = 2;
  bool oscillating = 3;
  int32 direction = 5;
  int32 speed_level = 6;
  string preset_mode = 7;
  uint32 device_id = 8;
}
message FanCommandRequest {
  fixed32 key = 1;
  bool has_state = 2;
  bool state = 3;
  bool has_oscillating = 6;
  bool oscillating = 7;
  bool has_direction = 8;
  int32 direction = 9;
  bool has_speed_level = 10;
  int32 speed_level = 11;
  bool has_preset_mode = 12;
  string preset_mode = 13;
  uint32 device_id = 14;
}

message ListEntitiesLightResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  float min_mireds = 9;
  float max_mireds = 10;
  repeated string effects = 11;
  repeated int32 supported_color_modes = 12 [packed = true];
  bool disabled_by_default = 13;
  string icon = 14;
  int32 entity_category = 15;
  uint32 device_id = 16;
}
message LightStateResponse {
  fixed32 key = 1;
  bool state = 2;
  float brightness = 3;
  float red = 4;
  float green = 5;
  float blue = 6;
  float white = 7;
  float color_temperature = 8;
  string effect = 9;
  float color_brightness = 10;
  int32 color_mode = 11;
  float cold_white = 12;
  float warm_white = 13;
  uint32 device_id = 14;
}
message LightCommandRequest {
  fixed32 key = 1;
  bool has_state = 2;
  bool state = 3;
  bool has_brightness = 4;
  float brightness = 5;
  bool has_rgb = 6;
  float red = 7;
  float green = 8;
  float blue = 9;
  uint32 device_id = 28;
}

message ListEntitiesSensorResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  string icon = 5;
  string unit_of_measurement = 6;
  int32 accuracy_decimals = 7;
  bool force_update = 8;
  string device_class = 9;
  int32 state_class = 10;
  bool disabled_by_default = 12;
  int32 entity_category = 13;
  uint32 device_id = 14;
}
message SensorStateResponse {
  fixed32 key = 1;
  float state = 2;
  bool missing_state = 3;
  uint32 device_id = 4;
}

message ListEntitiesSwitchResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  string icon = 5;
  bool assumed_state = 6;
  bool disabled_by_default = 7;
  int32 entity_category = 8;
  string device_class = 9;
  uint32 device_id = 10;
}
message SwitchStateResponse {
  fixed32 key = 1;
  bool state = 2;
  uint32 device_id = 3;
  bool missing_state = 4;
}
message SwitchCommandRequest {
  fixed32 key = 1;
  bool state = 2;
  uint32 device_id = 3;
}

message ListEntitiesTextSensorResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  string icon = 5;
  bool disabled_by_default = 6;
  int32 entity_category = 7;
  string device_class = 8;
  uint32 device_id = 9;
}
message TextSensorStateResponse {
  fixed32 key = 1;
  string state = 2;
  bool missing_state = 3;
  uint32 device_id = 4;
}

message ListEntitiesNumberResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  string icon = 5;
  float min_value = 6;
  float max_value = 7;
  float step = 8;
  bool disabled_by_default = 9;
  int32 entity_category = 10;
  string unit_of_measurement = 11;
  int32 mode = 12;
  string device_class = 13;
  uint32 device_id = 14;
}
message NumberStateResponse {
  fixed32 key = 1;
  float state = 2;
  bool missing_state = 3;
  uint32 device_id = 4;
}
message NumberCommandRequest {
  fixed32 key = 1;
  float state = 2;
  uint32 device_id = 3;
}

message ListEntitiesSelectResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  string icon = 5;
  repeated string options = 6;
  bool disabled_by_default = 7;
  int32 entity_category = 8;
  uint32 device_id = 9;
}
message SelectStateResponse {
  fixed32 key = 1;
  string state = 2;
  bool missing_state = 3;
  uint32 device_id = 4;
}
message SelectCommandRequest {
  fixed32 key = 1;
  string state = 2;
  uint32 device_id = 3;
}

message ListEntitiesButtonResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  string icon = 5;
  bool disabled_by_default = 6;
  int32 entity_category = 7;
  string device_class = 8;
  uint32 device_id = 9;
}
message ButtonCommandRequest {
  fixed32 key = 1;
  uint32 device_id = 2;
}

// Parsed only to preserve explicit UNMAPPED / DIAGNOSTIC evidence in v1.
message ListEntitiesClimateResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  bool disabled_by_default = 18;
  int32 entity_category = 20;
  uint32 device_id = 26;
  uint32 feature_flags = 27;
}
message ListEntitiesLockResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  bool disabled_by_default = 6;
  int32 entity_category = 7;
  bool assumed_state = 8;
  bool supports_open = 9;
  bool requires_code = 10;
  uint32 device_id = 12;
}
