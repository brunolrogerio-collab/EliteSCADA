<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%"><defs><!-- Gradiente para a Base Metálica Plana (Anel Cinza) --><linearGradient id="metal-base-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#777777" /><stop offset="25%" stop-color="#DDDDDD" /><stop offset="50%" stop-color="#FFFFFF" /><stop offset="75%" stop-color="#A6A6A6" /><stop offset="100%" stop-color="#555555" /></linearGradient><!-- Gradiente Cilíndrico para o Corpo do Botão (Pescoço Vermelho) --><linearGradient id="button-neck-grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#990000" /><stop offset="25%" stop-color="#FF3333" /><stop offset="60%" stop-color="#CC0000" /><stop offset="100%" stop-color="#550000" /></linearGradient><!-- Gradiente Radial para o Topo Abaulado (Efeito de Brilho 3D) --><radialGradient id="button-top-grad" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#FFAAAA" /><stop offset="15%" stop-color="#FF2222" /><stop offset="55%" stop-color="#CC0000" /><stop offset="85%" stop-color="#880000" /><stop offset="100%" stop-color="#4A0000" /></radialGradient></defs><!-- Grupo Geral com Fundo Transparente --><g stroke="none" fill="none"><!-- 1. Sombra Suave sob o Botão --><ellipse cx="150" cy="188" rx="102" ry="22" fill="#000000" fill-opacity="0.15" /><!-- 2. Base Metálica Inferior (Anel Elíptico) --><ellipse cx="150" cy="185" rx="98" ry="20" fill="url(#metal-base-grad)" /><!-- Rebaixo Interno da Base Metálica --><ellipse cx="150" cy="183" rx="86" ry="16" fill="#555555" /><!-- 3. Corpo Cilíndrico Vertical (Pescoço Vermelho) --><!-- Preenchimento Central --><rect x="72" y="105" width="156" height="65" fill="url(#button-neck-grad)" /><!-- Elipse de Junção Inferior do Pescoço --><ellipse cx="150" cy="170" rx="78" ry="14" fill="url(#button-neck-grad)" /><!-- 4. Cabeça do Botão (Formato Cogumelo) --><!-- Base Abaulada da Cabeça --><ellipse cx="150" cy="115" rx="94" ry="22" fill="url(#button-top-grad)" /><!-- Bloco de União da Cabeça --><rect x="56" y="75" width="188" height="40" fill="url(#button-top-grad)" /><!-- Calota Superior Arredondada (Lente do Topo) --><ellipse cx="150" cy="75" rx="94" ry="32" fill="url(#button-top-grad)" /></g></svg>
