name: OPC UA Product L2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/Scada.Drivers/OpcUa/**"
      - "tests/Scada.Drivers.Tests/OpcUaOpen62541ProductInteropTests.cs"
      - "interop-lab/opcua/open62541/**"
      - ".github/workflows/opcua-product-l2.yml"

permissions:
  contents: read

jobs:
  open62541-product-path:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Build pinned open62541 peer
        run: docker build -t elitescada-opcua-l2 interop-lab/opcua/open62541

      - name: Start open62541 peer
        run: docker run -d --name elitescada-opcua-l2 --network host elitescada-opcua-l2

      - name: Wait for OPC UA peer
        run: timeout 30 bash -c 'until nc -z 127.0.0.1 4840; do sleep 1; done'

      - name: Restore driver tests
        run: dotnet restore tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj

      - name: Run EliteSCADA OPC UA product-path L2
        env:
          ELITESCADA_OPCUA_L2_ENDPOINT: opc.tcp://127.0.0.1:4840
        shell: bash
        run: |
          mkdir -p TestResults/opcua-l2
          set +e
          dotnet test tests/Scada.Drivers.Tests/Scada.Drivers.Tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~OpcUaOpen62541ProductInteropTests" \
            --verbosity diagnostic \
            --logger "trx;LogFileName=opcua-l2.trx" \
            2>&1 | tee TestResults/opcua-l2/dotnet-test.log
          test_exit=${PIPESTATUS[0]}
          set -e
          exit "$test_exit"

      - name: Capture peer logs
        if: always()
        run: |
          mkdir -p TestResults/opcua-l2
          docker logs elitescada-opcua-l2 > TestResults/opcua-l2/open62541.log 2>&1 || true

      - name: Upload L2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcua-l2-diagnostics
          path: |
            TestResults/opcua-l2/**
            tests/Scada.Drivers.Tests/TestResults/**
          if-no-files-found: warn
          retention-days: 7

      - name: Stop peer
        if: always()
        run: docker rm -f elitescada-opcua-l2 || true