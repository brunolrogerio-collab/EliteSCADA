name: Wave 15 T1 PR validation

on:
  pull_request:
    branches: [wave15/corrections-integration]
  workflow_dispatch:
    inputs:
      validation_profile:
        description: Optional additive VALIDATION_PROFILE override (comma-separated)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Wave 15 validation profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coordination_exempt: ${{ steps.router.outputs.coordination_exempt }}
      run_common_sanity: ${{ steps.router.outputs.run_common_sanity }}
      run_web: ${{ steps.router.outputs.run_web }}
      run_dotnet: ${{ steps.router.outputs.run_dotnet }}
      run_e2e: ${{ steps.router.outputs.run_e2e }}
      run_driver: ${{ steps.router.outputs.run_driver }}
      run_ha_two_process: ${{ steps.router.outputs.run_ha_two_process }}
      effective_profiles: ${{ steps.router.outputs.effective_profiles }}
      dotnet_projects: ${{ steps.router.outputs.dotnet_projects }}
      e2e_specs: ${{ steps.router.outputs.e2e_specs }}
      driver_gate: ${{ steps.router.outputs.driver_gate }}
      run_native_zigbee: ${{ steps.native_scope.outputs.run_native_zigbee }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: router
        name: Resolve declared, inferred and effective profiles
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PROFILE_OVERRIDE: ${{ inputs.validation_profile || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          if [ -n "$PR_BASE_SHA" ]; then
            target_base="$PR_BASE_SHA"
            router_mode='pr'
          else
            git fetch --no-tags origin '+refs/heads/wave15/corrections-integration:refs/remotes/origin/wave15/corrections-integration'
            target_base='origin/wave15/corrections-integration'
            router_mode='dispatch'
          fi
          comparison_base="$(git merge-base "$target_base" "$PR_HEAD_SHA")"
          git diff --name-only "$comparison_base" "$PR_HEAD_SHA" > /tmp/changed-files.txt
          python3 scripts/ci/wave15_profile_router.py \
            --changed-files /tmp/changed-files.txt \
            --pr-body-file /tmp/pr-body.txt \
            --manual-override "$PROFILE_OVERRIDE" \
            --mode "$router_mode" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file /tmp/profile-summary.md
          cat /tmp/profile-summary.md >> "$GITHUB_STEP_SUMMARY"
      - id: native_scope
        name: Select Native Zigbee sidecar evidence
        env:
          NATIVE_CHANGED_FILES_PATH: /tmp/changed-files.txt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          changed = Path(os.environ["NATIVE_CHANGED_FILES_PATH"]).read_text().splitlines()
          pattern = re.compile(r"^(\.github/workflows/wave15-pr\.yml|scripts/ci/wave15_profile_router\.py|src/Scada.DriverHost/(Sidecars/(ZigbeeNative/.*|ManagedSidecar.*|SystemManagedSidecar.*)|Engineering/(ZigbeeNative.*|CommunicationDriverRuntime.*))|src/Scada.Drivers/HostResources/.*|tests/Scada.Drivers.Tests/(ZigbeeNative.*|ManagedSidecar.*|HostResource.*))$")
          artifact = Path("src/Scada.DriverHost/Sidecars/ZigbeeNative")
          component = Path("src/Scada.DriverHost/Engineering/ZigbeeNativeCommunicationRuntimeComponents.cs")
          selected = any(pattern.fullmatch(path) for path in changed) and (artifact.exists() or component.exists())
          if selected and not (artifact / "package.json").is_file():
              raise RuntimeError("Native Zigbee evidence requires its sidecar package.json")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run_native_zigbee={str(selected).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Native Zigbee sidecar evidence selected: {selected}\n")
          PY

  common-sanity:
    name: Common T1 sanity
    needs: classify
    if: needs.classify.outputs.run_common_sanity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the PR delta from its merge base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE_SHA" ]; then
            target_base="$PR_BASE_SHA"
          else
            git fetch --no-tags origin '+refs/heads/wave15/corrections-integration:refs/remotes/origin/wave15/corrections-integration'
            target_base='origin/wave15/corrections-integration'
          fi
          comparison_base="$(git merge-base "$target_base" "$PR_HEAD_SHA")"
          git diff --check "$comparison_base" "$PR_HEAD_SHA"
      - run: python3 -m unittest tests/ci/test_wave15_profile_router.py

  web-semantic:
    name: Web semantic build
    needs: classify
    if: needs.classify.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/scada-web/package-lock.json
      - working-directory: web/scada-web
        run: npm ci --no-audit --no-fund
      - working-directory: web/scada-web
        run: npm run build

  dotnet-focused:
    name: Focused .NET evidence
    needs: classify
    if: needs.classify.outputs.run_dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: timescale/timescaledb:2.29.2-pg18
        env:
          POSTGRES_DB: elitescada_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d elitescada_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ELITESCADA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=elitescada_test;Username=postgres;Password=postgres;Pooling=false
      ConnectionStrings__EliteScada: Host=127.0.0.1;Port=5432;Database=elitescada_test;Username=postgres;Password=postgres;Pooling=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Run owning focused test projects
        env:
          DOTNET_PROJECTS: ${{ needs.classify.outputs.dotnet_projects }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dotnet-projects.txt
          import json, os
          print(*json.loads(os.environ['DOTNET_PROJECTS']), sep='\n')
          PY
          while IFS= read -r project; do
            dotnet restore "$project"
            dotnet test "$project" --no-restore --configuration Release --verbosity minimal
          done < /tmp/dotnet-projects.txt

  chromium-focused:
    name: Focused Chromium evidence
    needs: classify
    if: needs.classify.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: timescale/timescaledb:2.29.2-pg18
        env:
          POSTGRES_DB: elitescada_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d elitescada_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__EliteScada: Host=127.0.0.1;Port=5432;Database=elitescada_e2e;Username=postgres;Password=postgres;Pooling=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/scada-web/package-lock.json
      - run: dotnet restore src/Scada.Api/Scada.Api.csproj
      - working-directory: web/scada-web
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/scada-web/package-lock.json') }}
      - working-directory: web/scada-web
        run: npx playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web/scada-web
        run: npx playwright install chromium
      - name: Run profile-owned specs
        working-directory: web/scada-web
        env:
          E2E_SPECS: ${{ needs.classify.outputs.e2e_specs }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/e2e-specs.txt
          import json, os
          print(*json.loads(os.environ['E2E_SPECS']), sep='\n')
          PY
          mapfile -t specs < /tmp/e2e-specs.txt
          npm run test:e2e -- "${specs[@]}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave15-focused-playwright-report
          path: web/scada-web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  ha-two-process:
    name: HA two-process evidence
    needs: classify
    if: needs.classify.outputs.run_ha_two_process == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - run: dotnet restore src/Scada.Api/Scada.Api.csproj
      - run: dotnet build src/Scada.Api/Scada.Api.csproj --no-restore --configuration Release
      - name: Run real two-process HA evidence
        run: python3 scripts/ci/ha_d1_two_process_evidence.py

  native-zigbee-sidecar:
    name: Native Zigbee Node and SBOM evidence
    needs: classify
    if: needs.classify.outputs.run_native_zigbee == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: src/Scada.DriverHost/Sidecars/ZigbeeNative
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: src/Scada.DriverHost/Sidecars/ZigbeeNative/package-lock.json
      - name: Use the qualified npm version
        run: npm install --global npm@11.19.0 --no-audit --no-fund
      - name: Verify exact runtime pins and install the locked sidecar
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
          npm ci --no-audit --no-fund
      - name: Verify SBOM and complete dependency notices
        run: npm run verify:dependencies
      - name: Load the pinned coordinator modules and native serial binding
        run: |
          node --input-type=module -e "await import('zigbee-herdsman'); await import('zigbee-herdsman-converters'); await import('zigbee-herdsman/dist/adapter/z-stack/adapter/manager.js');"
          node -e "require('@serialport/bindings-cpp').autoDetect()"
      - name: Run sidecar tests including the independent child-process peer
        run: npm test
      - name: Audit the exact production dependency lock
        run: npm audit --omit=dev
      - name: Record source and sidecar lock provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          {
            echo '## Native Zigbee sidecar evidence'
            echo "Source head: $PR_HEAD_SHA"
            echo "Source base: $PR_BASE_SHA"
            echo "Tested checkout: $(git rev-parse HEAD)"
            echo "Node: $(node --version); npm: $(npm --version)"
            sha256sum package-lock.json SBOM.cdx.json THIRD-PARTY-NOTICES.md
          } >> "$GITHUB_STEP_SUMMARY"

  t1-gate:
    name: Wave 15 T1 gate
    needs: [classify, common-sanity, web-semantic, dotnet-focused, chromium-focused, ha-two-process, native-zigbee-sidecar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLASSIFY: ${{ needs.classify.result }}
      COMMON: ${{ needs.common-sanity.result }}
      WEB: ${{ needs.web-semantic.result }}
      DOTNET: ${{ needs.dotnet-focused.result }}
      E2E: ${{ needs.chromium-focused.result }}
      HA_TWO_PROCESS: ${{ needs.ha-two-process.result }}
      NATIVE_ZIGBEE: ${{ needs.native-zigbee-sidecar.result }}
      EXEMPT: ${{ needs.classify.outputs.coordination_exempt }}
      NEED_WEB: ${{ needs.classify.outputs.run_web }}
      NEED_DOTNET: ${{ needs.classify.outputs.run_dotnet }}
      NEED_E2E: ${{ needs.classify.outputs.run_e2e }}
      NEED_HA_TWO_PROCESS: ${{ needs.classify.outputs.run_ha_two_process }}
      NEED_NATIVE_ZIGBEE: ${{ needs.classify.outputs.run_native_zigbee }}
      PROFILES: ${{ needs.classify.outputs.effective_profiles }}
      DRIVER_GATE: ${{ needs.classify.outputs.driver_gate }}
    steps:
      - name: Require all selected evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFY" = success
          if [ "$EXEMPT" != true ]; then test "$COMMON" = success; fi
          if [ "$NEED_WEB" = true ]; then test "$WEB" = success; fi
          if [ "$NEED_DOTNET" = true ]; then test "$DOTNET" = success; fi
          if [ "$NEED_E2E" = true ]; then test "$E2E" = success; fi
          if [ "$NEED_HA_TWO_PROCESS" = true ]; then test "$HA_TWO_PROCESS" = success; fi
          if [ "$NEED_NATIVE_ZIGBEE" = true ]; then test "$NATIVE_ZIGBEE" = success; fi
          {
            echo '## Wave 15 T1 gate';
            echo "Effective profiles: \`$PROFILES\`";
            echo "Web: $WEB; .NET: $DOTNET; Chromium: $E2E; HA two-process: $HA_TWO_PROCESS; Native Zigbee Node/SBOM: $NATIVE_ZIGBEE";
            echo "Driver/Seven-Driver/Interop: $DRIVER_GATE (specialized heavy gates are not claimed PASS by T1).";
            echo 'Universal integrated/main gate: REQUIRED NOW only for push checkpoint or main PR; otherwise UNCHANGED/TRUSTED.';
          } >> "$GITHUB_STEP_SUMMARY"
