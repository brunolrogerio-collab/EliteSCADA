<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <defs>
    <!-- Padrão de Hachura Listrada (Preto e Cinza/Branco) -->
    <pattern id="hatch-pattern" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#000000" stroke-width="3" />
      <rect width="10" height="10" fill="none" />
    </pattern>
    <!-- Gradiente Metálico Horizontal para a Calha Longa -->
    <linearGradient id="trough-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="15%" stop-color="#666666" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#555555" />
      <stop offset="80%" stop-color="#222222" />
      <stop offset="100%" stop-color="#444444" />
    </linearGradient>
    <!-- Gradiente para o Motor/Bloco Inclinado Superior -->
    <linearGradient id="motor-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#555555" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
  </defs>
  <!-- Grupo estrutural geral com contornos pretos e fundo transparente -->
  <g stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Suportes e Acionamento Traseiro -->
    <line x1="45" y1="60" x2="45" y2="210" stroke="#000000" stroke-width="4" />
    <line x1="102" y1="110" x2="102" y2="210" stroke="#000000" stroke-width="4" />
    <rect x="37" y="70" width="8" height="35" fill="#FFFFFF" />
    <rect x="45" y="55" width="35" height="55" fill="#333333" />
    <rect x="80" y="65" width="35" height="35" fill="#E5E5E5" />
    <rect x="110" y="55" width="40" height="155" fill="#222222" />
    <!-- Sistema de Correia e Polias Inclinado -->
    <path d="M 125 10 L 180 25 L 165 65 L 110 50 Z" fill="url(#motor-gradient)" />
    <path d="M 111 90 L 138 28 L 158 35 L 115 97 Z" fill="#222222" />
    <circle cx="111" cy="90" r="6" fill="#FFFFFF" stroke-width="2" />
    <circle cx="138" cy="28" r="6" fill="#FFFFFF" stroke-width="2" />
    <circle cx="158" cy="35" r="6" fill="#FFFFFF" stroke-width="2" />
    <!-- Painel de fundo da calha longa -->
    <rect x="110" y="110" width="440" height="90" fill="url(#trough-gradient)" />
    <!-- Estruturas Hachuradas -->
    <rect x="110" y="190" width="445" height="15" fill="url(#hatch-pattern)" />
    <path d="M 110 195 L 280 60 L 290 68 L 120 203 Z" fill="url(#hatch-pattern)" />
    <!-- Pilares frontais desenhados por último -->
    <g fill="#444444" stroke="#000000" stroke-width="2">
      <rect x="155" y="110" width="10" height="100" />
      <rect x="195" y="110" width="10" height="100" />
      <rect x="235" y="110" width="10" height="100" />
      <rect x="280" y="110" width="10" height="100" />
      <rect x="325" y="110" width="10" height="100" />
      <rect x="370" y="110" width="10" height="100" />
      <rect x="415" y="110" width="10" height="100" />
      <rect x="460" y="110" width="10" height="100" />
      <rect x="505" y="110" width="10" height="100" />
      <rect x="540" y="110" width="10" height="100" />
    </g>
  </g>
</svg>
