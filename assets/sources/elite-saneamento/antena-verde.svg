<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <!-- Gradiente verde suave para o corpo principal -->
    <linearGradient id="green-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76FF5B" />
      <stop offset="50%" stop-color="#4EFF30" />
      <stop offset="100%" stop-color="#1B9A05" />
    </linearGradient>
  </defs>
  <!-- Grupo estrutural com linhas de contorno pretas e fundo transparente -->
  <g stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Haste vertical da antena -->
    <rect x="195" y="60" width="8" height="60" fill="#1B9A05" />
    <!-- Conector/Base da haste -->
    <rect x="191" y="105" width="16" height="20" fill="#1B9A05" />
    <!-- Topo da haste (junção com a espiral) -->
    <rect x="191" y="55" width="14" height="14" fill="#1B9A05" />
    <!-- Estrutura Cônica da Antena: corpo horizontal central dentro dos anéis -->
    <rect x="202" y="59" width="70" height="6" fill="#1B9A05" />
    <!-- Anéis empilhados decrescentes (Efeito espiral/cônico) -->
    <rect x="205" y="40" width="8" height="44" rx="2" fill="#4EFF30" />
    <rect x="215" y="43" width="8" height="38" rx="2" fill="#4EFF30" />
    <rect x="225" y="46" width="8" height="32" rx="2" fill="#4EFF30" />
    <rect x="235" y="43" width="8" height="38" rx="2" fill="#4EFF30" />
    <rect x="245" y="46" width="8" height="32" rx="2" fill="#4EFF30" />
    <rect x="255" y="49" width="8" height="26" rx="2" fill="#4EFF30" />
    <rect x="265" y="52" width="8" height="20" rx="2" fill="#4EFF30" />
    <rect x="275" y="55" width="6" height="14" rx="1" fill="#4EFF30" />
    <!-- Bloco Horizontal Principal (Base Arredondada) -->
    <rect x="75" y="125" width="150" height="55" rx="15" fill="url(#green-gradient)" />
  </g>
</svg>
